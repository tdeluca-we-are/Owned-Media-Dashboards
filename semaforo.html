<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Are — Semáforo</title>
<link rel="icon" type="image/png" href="Iso.png">
<link rel="apple-touch-icon" href="Iso.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1929;--bg2:#112240;--bg3:#1a3355;
  --border:rgba(255,255,255,0.18);--border2:rgba(255,255,255,0.15);
  --text:#f0f0f0;--text2:#8892a4;--text3:#3d4f6b;
  --orange:#f04e23;--orange2:#d43d16;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#7a9eca;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:40px;width:100%;max-width:380px}
.text-logo-xl{font-size:36px;font-weight:800;letter-spacing:-0.03em;text-align:center;margin-bottom:6px}
.text-logo-sm{font-size:17px;font-weight:800;letter-spacing:-0.02em}
.logo-we{color:#f0f0f0}.logo-are{color:var(--orange)}
.auth-title{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
.fg input,.fg select{font-family:var(--font);font-size:14px;padding:11px 14px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--orange)}
.btn-primary{width:100%;font-family:var(--font);font-size:14px;font-weight:600;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;margin-top:6px}
.btn-primary:hover{background:var(--orange2)}
.auth-error{font-size:12px;color:var(--orange);text-align:center;margin-top:10px;min-height:18px}

/* shell */
.app{display:none;min-height:100vh;flex-direction:column}.app.visible{display:flex}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:200}
.top-left{display:flex;align-items:center;gap:10px}
.top-divider{width:1px;height:20px;background:var(--border2)}
.top-right{display:flex;align-items:center;gap:8px}
.user-pill{font-size:12px;color:var(--text2);font-family:var(--mono);background:var(--bg2);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.role-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em}
.role-admin{background:rgba(240,78,35,0.15);color:#f04e23;border:1px solid rgba(240,78,35,0.3)}
.role-analista{background:rgba(61,79,107,0.3);color:#7a9eca;border:1px solid rgba(61,79,107,0.5)}
.role-lector{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border2)}
.btn-sm{font-family:var(--font);font-size:12px;padding:6px 14px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer}
.btn-sm:hover{color:var(--orange);border-color:var(--orange)}
.btn-orange{font-family:var(--font);font-size:12px;font-weight:600;padding:8px 16px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);cursor:pointer}
.btn-orange:hover{background:var(--orange2)}
.btn-orange:disabled{opacity:.4;cursor:default}
.main{padding:20px 24px;max-width:1600px;width:100%;margin:0 auto}
.loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.tab{font-family:var(--font);font-size:13px;font-weight:500;padding:8px 18px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--orange);color:var(--text)}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
.tab-count{font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:20px}
.tab.active .tab-count{background:rgba(0,0,0,.25)}
.tab-count.warn{background:var(--red);color:#fff}
.pane{display:none}.pane.active{display:block}

/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.filters input{font-family:var(--font);font-size:12px;padding:7px 11px;background:var(--bg2);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);outline:none}
.filters select:focus,.filters input:focus{border-color:var(--orange)}
.filters input[type=search]{min-width:200px}
.filters label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.spacer{flex:1}

/* kpis */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--orange);border-radius:var(--radius-lg);padding:13px 16px}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:5px}
.kpi.ok{border-top-color:var(--green)}.kpi.bad{border-top-color:var(--red)}
.kpi.warn{border-top-color:var(--amber)}.kpi.mute{border-top-color:var(--text3)}

/* secciones y tablas */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);gap:12px}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2);position:sticky;top:0;z-index:1}
td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(255,255,255,.03)}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.muted{color:var(--text3)}
.strong{font-weight:600}
.wrap-cell{max-width:280px;font-size:12px;color:var(--text2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* grilla del semáforo */
.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:var(--bg2);z-index:2;min-width:230px}
.grid th:first-child{z-index:3}
.grid td.cell{padding:5px 6px;text-align:center}
.grid tr.srow td:first-child{background:var(--bg2);padding-left:34px;font-size:12px;color:var(--text2)}
.grid tr.srow td{background:rgba(0,0,0,.13)}
.caret{display:inline-block;width:16px;color:var(--text3);font-size:10px;transition:transform .15s}
.caret.open{transform:rotate(90deg);color:var(--orange)}
.sem{display:block;border-radius:6px;padding:6px 4px;font-size:10.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;cursor:pointer;min-width:74px;border:1px solid transparent}
.sem:hover{outline:1px solid rgba(255,255,255,.5)}
.sem-verde{background:#16a34a;color:#fff}
.sem-amarillo{background:#f59e0b;color:#3b2300}
.sem-rojo{background:#dc2626;color:#fff}
.sem-sin_servicio{background:rgba(255,255,255,.05);color:var(--text3)}
.sem-vacio{background:transparent;color:var(--text3);border:1px dashed var(--text3);font-weight:500;text-transform:none}
.sem-forzado{position:relative}
.sem-forzado::after{content:'';position:absolute;top:2px;right:3px;width:0;height:0;
  border-left:5px solid transparent;border-top:5px solid rgba(255,255,255,.8)}
/* fila de célula: separa visualmente los grupos de marcas */
.grid tr.crow td{background:var(--bg3);border-top:1px solid var(--border);padding:7px 14px}
.grid tr.crow td:first-child{background:var(--bg3)}
.crow-name{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.crow-kam{font-size:11px;color:var(--text2);font-weight:500;text-transform:none;letter-spacing:0;margin-left:8px}
.crow-mini{display:inline-flex;gap:3px;margin-left:10px;vertical-align:middle}
.crow-mini i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:20px;white-space:nowrap}
.chip.green{background:rgba(34,197,94,.13);color:#22c55e;border:1px solid rgba(34,197,94,.28)}
.chip.red{background:rgba(239,68,68,.13);color:#ef4444;border:1px solid rgba(239,68,68,.28)}
.chip.amber{background:rgba(245,158,11,.13);color:#f59e0b;border:1px solid rgba(245,158,11,.28)}
.chip.blue{background:rgba(122,158,202,.13);color:#7a9eca;border:1px solid rgba(122,158,202,.28)}
.chip.grey{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border2)}
.chip.orange{background:rgba(240,78,35,.13);color:#f04e23;border:1px solid rgba(240,78,35,.3)}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);border-left:1px solid var(--border);z-index:301;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.drawer-meta{font-size:12px;color:var(--text2);margin-top:4px}
.drawer-body{padding:18px 22px;overflow-y:auto;flex:1}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.drawer-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.drawer-close:hover{color:var(--orange)}
.dsec{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.09em;margin:22px 0 9px}
.dsec:first-child{margin-top:0}

/* bloques de números */
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:13px;
  border-top:2px solid var(--text3);position:relative}
.metric.up{border-top-color:var(--green)}.metric.down{border-top-color:var(--red)}
.metric-name{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
.metric input{width:100%;font-family:var(--mono);font-size:13px;padding:7px 9px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;outline:none;text-align:right}
.metric input:focus{border-color:var(--orange)}
.metric .mlab{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 3px 2px;font-weight:700}
.metric .mgap{margin-top:7px}
.metric-dev{margin-top:11px;text-align:center;font-family:var(--mono);font-size:21px;font-weight:700;line-height:1.1}
.metric-dev .arrow{font-size:15px;margin-right:3px}
.dev-ok{color:var(--green)}.dev-bad{color:var(--red)}
.dev-none{color:var(--text3);font-size:12px;font-weight:400}
.metric-view{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--text2);margin-top:3px}
/* barra real vs objetivo */
.metric-bar{height:6px;background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden;margin-top:9px;position:relative}
.metric-bar span{display:block;height:100%;border-radius:20px;transition:width .25s}
.metric-bar span.ok{background:var(--green)}.metric-bar span.bad{background:var(--red)}
.metric-bar::after{content:'';position:absolute;top:-2px;bottom:-2px;left:calc(100% - 1px);width:2px;background:var(--text2)}
.metric-foot{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text3);margin-top:5px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:700}

/* servicios en el drawer */
.srv{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);margin-bottom:7px;flex-wrap:wrap}
.srv-name{flex:1;font-size:13px;font-weight:500;min-width:120px}
.seg{display:flex;gap:3px}
.seg button{font-family:var(--font);font-size:10px;font-weight:700;padding:5px 9px;background:transparent;color:var(--text3);
  border:1px solid var(--border2);border-radius:6px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.seg button:hover{color:var(--text)}
.seg button.on.verde{background:#16a34a;border-color:#16a34a;color:#fff}
.seg button.on.amarillo{background:#f59e0b;border-color:#f59e0b;color:#3b2300}
.seg button.on.rojo{background:#dc2626;border-color:#dc2626;color:#fff}
.seg button.on.sin_servicio{background:var(--bg3);border-color:var(--border);color:var(--text2)}
.srv-nota{width:100%;font-family:var(--font);font-size:12px;padding:6px 9px;background:var(--bg3);color:var(--text);
  border:1px solid var(--border2);border-radius:8px;outline:none}
.srv-nota:focus{border-color:var(--orange)}
/* el servicio es lo que se carga, así que manda visualmente */
.srv.pend{border-left:3px solid var(--text3)}
.srv.set-verde{border-left:3px solid #16a34a}
.srv.set-amarillo{border-left:3px solid #f59e0b}
.srv.set-rojo{border-left:3px solid #dc2626}
.seg.big button{font-size:11px;padding:7px 12px}

/* resumen del color de la marca: calculado, no editable de entrada */
.resumen{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--bg2);
  border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 15px}
.resumen-dot{width:34px;height:34px;border-radius:9px;flex-shrink:0}
.resumen-dot.verde{background:#16a34a}.resumen-dot.amarillo{background:#f59e0b}
.resumen-dot.rojo{background:#dc2626}.resumen-dot.sin_servicio{background:rgba(255,255,255,.08)}
.resumen-txt{flex:1;min-width:140px}
.resumen-est{font-size:15px;font-weight:700;letter-spacing:-.01em}
.resumen-sub{font-size:11.5px;color:var(--text3);margin-top:2px}
.link-mini{background:none;border:none;color:var(--text3);font-family:var(--font);font-size:11px;
  cursor:pointer;text-decoration:underline;padding:0}
.link-mini:hover{color:var(--orange)}

/* preguntas: cada una es una tarjeta numerada */
.qbox{background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--orange);
  border-radius:var(--radius-lg);padding:13px 15px;margin-bottom:11px}
.qbox.q-plan{border-left-color:var(--blue)}
.qhdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.qnum{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:var(--orange);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qbox.q-plan .qnum{background:var(--blue);color:#0b1929;font-size:13px}
.qlab{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35;padding-top:3px}
.qsub{font-size:11px;color:var(--text3);font-weight:400;margin-top:2px}
textarea.q{width:100%;min-height:76px;font-family:var(--font);font-size:13px;line-height:1.5;padding:10px 12px;
  background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);outline:none;resize:vertical}
textarea.q:focus{border-color:var(--orange)}
.qview{font-size:13px;line-height:1.55;color:var(--text);white-space:pre-wrap}
.qview.vacio{color:var(--text3);font-style:italic}
.qfill{display:flex;gap:5px;margin-top:8px}
.qfill i{flex:1;height:3px;border-radius:20px;background:rgba(255,255,255,.09)}
.qfill i.done{background:var(--green)}

/* hilo de comentarios del plan de acción */
.cmt{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;margin-bottom:7px}
.cmt-meta{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
.cmt-txt{font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.cmt-add{display:flex;gap:7px;margin-top:9px}
.cmt-add input{flex:1;font-family:var(--font);font-size:12.5px;padding:9px 11px;background:var(--bg2);color:var(--text);
  border:1px solid var(--border2);border-radius:var(--radius);outline:none;min-width:0}
.cmt-add input:focus{border-color:var(--orange)}

/* varios */
.empty{text-align:center;padding:44px 20px;color:var(--text3);font-size:13px}
.note{font-size:12px;color:var(--text2);background:rgba(240,78,35,.07);border:1px solid rgba(240,78,35,.2);border-left:2px solid var(--orange);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;line-height:1.55}
.note.blue{background:rgba(122,158,202,.07);border-color:rgba(122,158,202,.2);border-left-color:var(--blue)}
.mini{font-family:var(--font);font-size:10px;font-weight:600;padding:3.5px 8px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:6px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--orange);color:var(--orange)}
.mini.on{background:var(--orange);border-color:var(--orange);color:#fff}
.mini.danger:hover{border-color:var(--red);color:var(--red)}
.addrow{display:flex;gap:7px;margin:12px 18px 16px}
.addrow select,.addrow input{flex:1;font-family:var(--font);font-size:12.5px;padding:9px 11px;background:var(--bg2);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);outline:none;min-width:0}
.addrow select:focus,.addrow input:focus{border-color:var(--orange)}
/* chips para filtrar por estado dentro de cada solapa */
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fchips .flab{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-right:3px}
.fchip{font-family:var(--font);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
  background:transparent;color:var(--text2);border:1px solid var(--border2);display:inline-flex;align-items:center;gap:6px}
.fchip:hover{color:var(--text);border-color:var(--text2)}
.fchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fchip b{font-family:var(--mono);font-size:10px;opacity:.75;font-weight:700}
.fchip.on{color:#fff;border-color:transparent}
.fchip.on.todos{background:var(--bg3);color:var(--text);border-color:var(--border)}
.fchip.on.verde{background:#16a34a}
.fchip.on.amarillo{background:#f59e0b;color:#3b2300}
.fchip.on.rojo{background:#dc2626}
.fchip.on.sin_servicio{background:var(--bg3);color:var(--text2);border-color:var(--border)}

/* buscador de marcas: una línea que despliega al tocarla, no una lista fija */
.combo{position:relative;display:inline-block;min-width:260px}
.combo-btn{width:100%;display:flex;align-items:center;gap:8px;font-family:var(--font);font-size:13px;
  font-weight:600;padding:7px 12px;background:var(--bg2);color:var(--text);border:1px solid var(--border2);
  border-radius:var(--radius);cursor:pointer;text-align:left}
.combo-btn:hover{border-color:var(--orange)}

.combo-pop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:250;width:330px;max-width:88vw;

.combo.open .combo-pop{display:block}
.combo-pop input{width:100%;font-family:var(--font);font-size:13px;padding:10px 13px;background:var(--bg3);

.combo-list{max-height:270px;overflow-y:auto;padding:5px 0}
.combo-cel{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);
  padding:9px 13px 4px}
.pick{width:100%;font-family:var(--font);font-size:13px;font-weight:500;padding:7px 13px;border:none;
  cursor:pointer;background:transparent;color:var(--text2);display:flex;align-items:center;gap:9px;text-align:left}
.pick:hover{background:var(--bg3);color:var(--text)}
.pick.on{background:var(--orange);color:#fff;font-weight:600}
.pick i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.combo-vacio{padding:14px 13px;font-size:12px;color:var(--text3)}

/* rango de meses */
.rango{display:inline-flex;align-items:center;gap:4px}
.rango .mini{padding:5px 9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text3);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:11px 20px;font-size:13px;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{border-color:var(--red);color:#ffb4b4}
</style>

<body>

<!-- ══ LOGIN ══ -->
<div class="auth-screen" id="authScreen">

</div>

<!-- ══ APP ══ -->
<div class="app" id="app">
  <div class="top-bar">

      <div class="text-logo-sm"><span class="logo-we">WE</span><span class="logo-are">ARE</span></div>

  <div class="main">

</div>

<div class="drawer-bg" id="drawerBg"></div>

    <div><div class="drawer-name" id="dName"></div><div class="drawer-meta" id="dMeta"></div></div>
    <button class="drawer-close" id="dClose">&times;</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot" id="dFoot" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL  = 'https://ojzcxwhoinmljospgmfp.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qemN4d2hvaW5tbGpvc3BnbWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDY5MTYsImV4cCI6MjA5MzQ4MjkxNn0.jmvVP3weuclrBpQJb57BwmHD77Ofy4CDe43cnmiSFCk';
const sb = supabase.createClient(SB_URL, SB_ANON);

const ESTADOS = ['verde','amarillo','rojo','sin_servicio'];
const ELABEL  = {verde:'Verde', amarillo:'Amarillo', rojo:'Rojo', sin_servicio:'Sin servicio'};
const MESES   = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PREGUNTAS = [
  '¿Por qué el semáforo tiene ese color?',
  '¿Qué se está haciendo para revertirlo o mantenerlo?',
  '¿Cuál es el foco/prioridad del cliente en la próxima quincena a nivel negocio?'
];

var me   = null;   // fila de sem_usuarios
var D    = {};     // todo lo cargado
var tab  = 'tablero';
var form = null;   // borrador del cierre que se está editando
var abiertas = {}; // marcas desplegadas en la grilla

// ── helpers ────────────────────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg, isErr){
  var t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.className = 'toast'; }, 2800);
}
function num(v){ var x = Number(v); return isFinite(x) ? x : null; }
function fmtN(v, dec){
  if (v == null || v === '') return '—';
  return Number(v).toLocaleString('es-AR', {minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
}
function fmtPct(v){ return v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%'; }
function periodoLabel(p){
  if (!p) return '';
  var d = p.split('-');
  return MESES[Number(d[1]) - 1] + ' ' + d[0].slice(2);
}
function periodoLargo(p){
  var d = p.split('-');
  var largos = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return largos[Number(d[1]) - 1] + ' ' + d[0];
}
// primer día del mes, como texto YYYY-MM-01
function mesDe(date){
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-01';
}
function mesAnterior(n){
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (n || 0));
  return mesDe(d);
}
// últimos n meses terminando en el mes cerrado (el anterior al actual)
function ultimosMeses(n){
  var out = [];
  for (var i = n - 1; i >= 0; i--) out.push(mesAnterior(i + 1));
  return out;
}
function peor(estados){
  if (estados.indexOf('rojo') >= 0) return 'rojo';
  if (estados.indexOf('amarillo') >= 0) return 'amarillo';
  if (estados.indexOf('verde') >= 0) return 'verde';
  return 'sin_servicio';
}
function puedeEditar(marcaId){
  if (!me) return false;
  if (me.rol === 'admin') return true;
  return me.rol === 'analista' && D.misMarcas.indexOf(marcaId) >= 0;
}
// PostgREST corta en 1000 filas: paginamos hasta que devuelva menos que el page size
function fetchAll(tabla, cols, filtro){
  var out = [], size = 1000;
  function paso(page){
    var q = sb.from(tabla).select(cols || '*');
    if (filtro) q = filtro(q);
    return q.range(page * size, (page + 1) * size - 1).then(function(r){
      if (r.error) throw r.error;
      var rows = r.data || [];
      out = out.concat(rows);
      return rows.length < size ? out : paso(page + 1);
    });
  }
  return paso(0);
}

// ── auth ───────────────────────────────────────────────────────────────────
$('loginBtn').onclick = function(){
  var e = $('email').value.trim(), p = $('pass').value;
  if (!e || !p) { $('authErr').textContent = 'Completá email y contraseña'; return; }
  $('authErr').textContent = '';
  sb.auth.signInWithPassword({ email: e, password: p }).then(function(r){
    if (r.error) {
      // el mensaje crudo de Supabase: "invalid credentials" no es lo mismo que
      // "email not confirmed" o un rate limit, y con un texto genérico no se distingue
      $('authErr').textContent = r.error.message || 'No se pudo entrar';
      return;
    }
    boot();
  });
};
$('pass').onkeydown = function(ev){ if (ev.key === 'Enter') $('loginBtn').click(); };
$('logoutBtn').onclick = function(){ sb.auth.signOut().then(function(){ location.reload(); }); };

sb.auth.getSession().then(function(r){ if (r.data.session) boot(); });

function boot(){
  sb.auth.getUser().then(function(ru){
    var u = ru.data.user;
    if (!u) return;
    sb.rpc('sem_vincular').then(function(r){
      var row = (r.data || [])[0];
      if (r.error || !row){
        $('authErr').textContent = 'Tu usuario no está habilitado en el semáforo';
        sb.auth.signOut();
        return;
      }
      me = row;
      $('authScreen').style.display = 'none';
      $('app').classList.add('visible');
      $('userPill').textContent = me.nombre || me.email;
      $('roleBadge').textContent = me.rol;
      $('roleBadge').className = 'role-badge role-' + me.rol;
      cargar();
    });
  });
}

// ── datos ──────────────────────────────────────────────────────────────────
function cargar(){
  Promise.all([
    fetchAll('sem_marcas', '*', function(q){ return q.order('nombre'); }),
    fetchAll('sem_servicios', '*', function(q){ return q.eq('activo', true).order('orden'); }),
    fetchAll('sem_marca_servicios', '*'),
    fetchAll('sem_v_marcas_mes', '*'),
    // el detalle es la tabla grande (marcas × meses × servicios): traigo solo el
    // rango que las grillas pueden llegar a mostrar. El resumen por mes viene entero.
    fetchAll('sem_v_detalle', '*', function(q){ return q.gte('periodo', mesAnterior(24)); }),
    fetchAll('sem_usuarios', '*', function(q){ return q.order('nombre'); }),
    fetchAll('sem_usuario_marcas', '*'),
    fetchAll('sem_celulas', '*', function(q){ return q.order('nombre'); }),
    fetchAll('sem_comentarios', '*', function(q){ return q.order('creado_at'); })
  ]).then(function(res){
    D.marcas    = res[0];
    D.servicios = res[1];
    D.ms        = res[2];
    D.mes       = res[3];
    D.det       = res[4];
    D.usuarios  = res[5];
    D.um        = res[6];
    D.celulas   = res[7];
    D.coment    = res[8];
    D.misMarcas = D.um.filter(function(x){ return x.usuario_id === me.id; })
                      .map(function(x){ return x.marca_id; });
    D.marcaById    = {}; D.marcas.forEach(function(m){ D.marcaById[m.id] = m; });
    D.servicioById = {}; D.servicios.forEach(function(s){ D.servicioById[s.id] = s; });
    D.celulaById   = {}; D.celulas.forEach(function(c){ D.celulaById[c.id] = c; });
    render();
  }).catch(function(e){
    $('panes').innerHTML = '<div class="empty">No se pudieron cargar los datos.<br><span class="muted">' +
      esc(e.message || e) + '</span></div>';
  });
}

// servicios contratados hoy por una marca, ordenados
function serviciosDe(marcaId){
  var ids = D.ms.filter(function(x){ return x.marca_id === marcaId; })
                .map(function(x){ return x.servicio_id; });
  return D.servicios.filter(function(s){ return ids.indexOf(s.id) >= 0; });
}
function regDe(marcaId, periodo){
  return D.mes.find(function(r){ return r.marca_id === marcaId && r.periodo === periodo; });
}
function detDe(marcaId, periodo){
  return D.det.filter(function(d){ return d.marca_id === marcaId && d.periodo === periodo; })
              .sort(function(a,b){ return a.servicio_orden - b.servicio_orden; });
}

// ── shell ──────────────────────────────────────────────────────────────────
function render(){
  var esAdmin = me.rol === 'admin';
  var pend = pendientesDe(mesAnterior(1)).length;
  var defs = [
    ['tablero',  'Tablero',  D.marcas.filter(function(m){ return m.activa; }).length, false],
    ['carga',    'Carga mensual', pend, pend > 0],
    ['marca',    'Por marca', null, false],
    ['servicio', 'Por servicio', null, false],
    ['estados',  'Por estado', null, false]
  ];
  if (esAdmin){
    defs.push(['marcas',  'Marcas', D.marcas.length, false]);
    defs.push(['accesos', 'Accesos', D.usuarios.length, false]);
  }
  $('tabs').innerHTML = defs.map(function(d){
    return '<button class="tab' + (tab === d[0] ? ' active' : '') + '" data-t="' + d[0] + '">' + d[1] +
      (d[2] != null ? '<span class="tab-count' + (d[3] ? ' warn' : '') + '">' + d[2] + '</span>' : '') + '</button>';
  }).join('');
  Array.prototype.forEach.call($('tabs').children, function(b){
    b.onclick = function(){ tab = b.dataset.t; render(); };
  });

  if (tab === 'tablero')       renderTablero();
  else if (tab === 'carga')    renderCarga();
  else if (tab === 'marca')    renderPorMarca();
  else if (tab === 'servicio') renderPorServicio();
  else if (tab === 'estados')  renderEstados();
  else if (tab === 'marcas')   renderMarcas();
  else if (tab === 'accesos')  renderAccesos();
}

// nombre de la célula de una marca (o el cajón de las que no tienen)
function celulaDe(marcaId){
  var m = D.marcaById[marcaId];
  var c = m && m.celula_id ? D.celulaById[m.celula_id] : null;
  return c || {id: 0, nombre: 'Sin célula', kam: null};
}

function pendientesDe(periodo){
  return D.marcas.filter(function(m){
    return m.activa && !regDe(m.id, periodo);
  });
}

// ══ TABLERO ═══════════════════════════════════════════════════════════════
var tbBusca = '', tbSoloActivas = true, tbCelula = '', tbEstado = '', tbRango = null;

function renderTablero(){
  if (!tbRango) tbRango = rangoPorDefecto();
  var meses = rangoMeses(tbRango.desde, tbRango.hasta);
  var ultimo = meses[meses.length - 1];
  var marcas = D.marcas.filter(function(m){
    if (tbSoloActivas && !m.activa) return false;
    if (tbCelula && String(celulaDe(m.id).id) !== tbCelula) return false;
    return !tbBusca || m.nombre.toLowerCase().indexOf(tbBusca.toLowerCase()) >= 0;
  });

  // KPIs del último mes cerrado
  var regs = marcas.map(function(m){ return regDe(m.id, ultimo); }).filter(Boolean);
  var cnt = {todos: marcas.length, verde:0, amarillo:0, rojo:0, sin_servicio:0};
  regs.forEach(function(r){ if (cnt[r.estado] != null) cnt[r.estado]++; });
  var sinCargar = marcas.length - regs.length;

  // el chip de estado filtra por cómo quedó la marca en el último mes cerrado
  marcas = marcas.filter(function(m){
    if (!tbEstado) return true;
    var r = regDe(m.id, ultimo);
    return r && r.estado === tbEstado;
  });
  var devs = regs.map(function(r){ return r.fact_desvio; }).filter(function(v){ return v != null; });
  var devProm = devs.length ? devs.reduce(function(a,b){ return a + Number(b); }, 0) / devs.length : null;

  var html = '';
  html += '<div class="filters">' +
    selectorRango('tb', tbRango.desde, tbRango.hasta) +
    '<label>Célula</label><select id="tbC"><option value="">Todas</option>' +
      celulasConMarcas().map(function(c){
        return '<option value="' + c.id + '"' + (tbCelula == c.id ? ' selected' : '') + '>' +
          esc(c.nombre) + (c.kam ? ' — ' + esc(c.kam) : '') + '</option>'; }).join('') +
    '</select>' +
    '<input type="search" id="tbQ" placeholder="Buscar marca…" value="' + esc(tbBusca) + '">' +
    '<label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text2)">' +
      '<input type="checkbox" id="tbA"' + (tbSoloActivas ? ' checked' : '') + '> solo marcas activas</label>' +
    '<div class="spacer"></div>' +
    '<button class="btn-sm" id="tbExpand">Desplegar todo</button>' +
    '<button class="btn-sm" id="tbCollapse">Plegar todo</button>' +
  '</div>';

  html += '<div class="kpi-row">' +
    kpi('Verde', cnt.verde, periodoLargo(ultimo), 'ok') +
    kpi('Amarillo', cnt.amarillo, periodoLargo(ultimo), 'warn') +
    kpi('Rojo', cnt.rojo, periodoLargo(ultimo), 'bad') +
    kpi('Sin cargar', sinCargar, 'de ' + cnt.todos + ' marcas', sinCargar ? 'mute' : 'ok') +
    kpi('Desvío facturación', devProm == null ? '—' : fmtPct(devProm), 'promedio del mes',
        devProm == null ? 'mute' : (devProm >= 0 ? 'ok' : 'bad')) +
  '</div>';

  html += chipsEstado(tbEstado, 'Marcas en ' + periodoLabel(ultimo), cnt);

  html += '<div class="legend">' +
    '<span><i style="background:#16a34a"></i> Verde</span>' +
    '<span><i style="background:#f59e0b"></i> Amarillo</span>' +
    '<span><i style="background:#dc2626"></i> Rojo</span>' +
    '<span><i style="background:rgba(255,255,255,.12)"></i> Sin servicio</span>' +
    '<span><i style="border:1px dashed var(--text3)"></i> Sin cargar</span>' +
    '<span class="muted">· el color de la marca es el peor de sus servicios · clic en una celda para ver el detalle</span>' +
  '</div>';

  html += '<div class="section"><div class="twrap"><table class="grid"><thead><tr>' +
    '<th>Marca</th>' + meses.map(function(p){ return '<th style="text-align:center">' + periodoLabel(p) + '</th>'; }).join('') +
  '</tr></thead><tbody>';

  if (!marcas.length) html += '<tr><td colspan="' + (meses.length + 1) + '"><div class="empty">No hay marcas para mostrar</div></td></tr>';

  agruparPorCelula(marcas).forEach(function(g){
    // encabezado de la célula, con el resumen de colores del último mes cerrado
    var res = {verde:0, amarillo:0, rojo:0};
    g.marcas.forEach(function(m){
      var r = regDe(m.id, ultimo);
      if (r && res[r.estado] != null) res[r.estado]++;
    });
    html += '<tr class="crow"><td><span class="crow-name">' + esc(g.celula.nombre) + '</span>' +
      (g.celula.kam ? '<span class="crow-kam">KAM ' + esc(g.celula.kam) + '</span>' : '') +
      '<span class="crow-kam">' + g.marcas.length + ' marca' + (g.marcas.length === 1 ? '' : 's') + '</span>' +
      '<span class="crow-mini">' +
        (res.verde ? '<i style="background:#16a34a" title="' + res.verde + ' en verde"></i>' : '') +
        (res.amarillo ? '<i style="background:#f59e0b" title="' + res.amarillo + ' en amarillo"></i>' : '') +
        (res.rojo ? '<i style="background:#dc2626" title="' + res.rojo + ' en rojo"></i>' : '') +
      '</span></td><td colspan="' + meses.length + '"></td></tr>';

    g.marcas.forEach(function(m){
      var srvs = serviciosDe(m.id);
      var open = !!abiertas[m.id];
      html += '<tr><td><span class="caret' + (open ? ' open' : '') + '" data-toggle="' + m.id + '">&#9654;</span>' +
        '<span class="strong">' + esc(m.nombre) + '</span>' +
        (m.activa ? '' : ' <span class="chip grey">baja</span>') +
        ' <span class="muted" style="font-size:11px">' + srvs.length + '</span></td>';
      meses.forEach(function(p){
        var r = regDe(m.id, p);
        html += '<td class="cell">' + celda(r ? r.estado : null, m.id, p, r && r.estado_forzado) + '</td>';
      });
      html += '</tr>';

      if (open){
        // servicios: los contratados hoy + los que aparezcan en el histórico visible
        var vistos = {};
        srvs.forEach(function(s){ vistos[s.id] = true; });
        D.det.forEach(function(d){
          if (d.marca_id === m.id && meses.indexOf(d.periodo) >= 0) vistos[d.servicio_id] = true;
        });
        Object.keys(vistos).map(function(id){ return D.servicioById[Number(id)]; })
          .filter(Boolean)
          .sort(function(a,b){ return a.orden - b.orden; })
          .forEach(function(s){
            html += '<tr class="srow"><td>' + esc(s.nombre) + '</td>';
            meses.forEach(function(p){
              var d = D.det.find(function(x){
                return x.marca_id === m.id && x.periodo === p && x.servicio_id === s.id; });
              var r = regDe(m.id, p);
              html += '<td class="cell">' + celda(r ? (d ? d.estado : 'sin_servicio') : null, m.id, p) + '</td>';
            });
            html += '</tr>';
          });
      }
    });
  });
  html += '</tbody></table></div></div>';

  $('panes').innerHTML = '<div class="pane active">' + html + '</div>';

  bindRango('tb', tbRango.desde, tbRango.hasta, function(d, h){
    tbRango = {desde: d, hasta: h}; renderTablero();
  });
  $('tbC').onchange = function(){ tbCelula = this.value; renderTablero(); };
  $('tbQ').oninput  = function(){ tbBusca = this.value; renderTablero(); };
  $('tbA').onchange = function(){ tbSoloActivas = this.checked; renderTablero(); };
  $('tbExpand').onclick = function(){ marcas.forEach(function(m){ abiertas[m.id] = true; }); renderTablero(); };
  $('tbCollapse').onclick = function(){ abiertas = {}; renderTablero(); };
  bindChips(function(e){ tbEstado = e; renderTablero(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      var id = Number(el.dataset.toggle);
      abiertas[id] = !abiertas[id];
      renderTablero();
    };
  });
  bindCeldas();
}

function kpi(label, val, sub, cls){
  return '<div class="kpi ' + (cls || '') + '"><div class="kpi-label">' + esc(label) + '</div>' +
    '<div class="kpi-val">' + esc(String(val)) + '</div><div class="kpi-sub">' + esc(sub) + '</div></div>';
}
function celda(estado, marcaId, periodo, forzado){
  if (!estado) return '<span class="sem sem-vacio" data-m="' + marcaId + '" data-p="' + periodo + '">+</span>';
  return '<span class="sem sem-' + estado + (forzado ? ' sem-forzado' : '') + '" data-m="' + marcaId +
    '" data-p="' + periodo + '">' + ELABEL[estado] + '</span>';
}
function bindCeldas(){
  Array.prototype.forEach.call(document.querySelectorAll('.sem[data-m]'), function(el){
    el.onclick = function(){ abrirCierre(Number(el.dataset.m), el.dataset.p); };
  });
}
// ── filtro por estado, reusable en cada solapa ─────────────────────────────
// `conteo` lleva cuántos hay de cada color para mostrarlo en el chip
function chipsEstado(sel, etiqueta, conteo){
  var defs = [['', 'Todos']].concat(ESTADOS.map(function(e){ return [e, ELABEL[e]]; }));
  return '<div class="fchips"><span class="flab">' + esc(etiqueta) + '</span>' +
    defs.map(function(d){
      var clave = d[0] || 'todos';

function bindChips(fn){

// ── buscador de marcas ─────────────────────────────────────────────────────
// Con 50+ marcas ni un <select> ni una lista siempre abierta sirven: combo de
// una línea que despliega un buscador al tocarlo.
function comboMarcas(sel, busca, abierto, mesRef){
  var activas = D.marcas.filter(function(m){ return m.activa; });
  var elegida = D.marcaById[Number(sel)];
  var rSel = elegida ? regDe(elegida.id, mesRef) : null;
  var cSel = elegida ? celulaDe(elegida.id) : null;
  var q = busca.trim().toLowerCase();
  var marcas = activas.filter(function(m){
    return !q || m.nombre.toLowerCase().indexOf(q) >= 0 ||
                 celulaDe(m.id).nombre.toLowerCase().indexOf(q) >= 0;
  });

  var html = '<div class="combo' + (abierto ? ' open' : '') + '" id="cbBox">' +
    '<button class="combo-btn" id="cbBtn">' +
      '<i style="background:' + (rSel ? colorDe(rSel.estado) : 'transparent') +
        (rSel ? '' : ';border:1px dashed var(--text3)') + '"></i>' +
      (elegida ? esc(elegida.nombre) : 'Elegí una marca') +
      (cSel ? '<span class="cel">' + esc(cSel.nombre) + '</span>' : '<span class="cel"></span>') +
      '<span class="car">&#9660;</span>' +
    '</button>' +
    '<div class="combo-pop">' +
      '<input type="search" id="cbQ" placeholder="Buscar marca o célula…" value="' + esc(busca) + '">' +
      '<div class="combo-list">';
  if (!marcas.length) html += '<div class="combo-vacio">Ninguna marca coincide con “' + esc(busca) + '”</div>';
  agruparPorCelula(marcas).forEach(function(g){
    html += '<div class="combo-cel">' + esc(g.celula.nombre) +
      (g.celula.kam ? ' · ' + esc(g.celula.kam) : '') + '</div>';
    html += g.marcas.map(function(m){
      var r = regDe(m.id, mesRef);
      return '<button class="pick' + (String(m.id) === String(sel) ? ' on' : '') + '" data-pick="' + m.id + '">' +
        '<i style="background:' + (r ? colorDe(r.estado) : 'transparent') +
          (r ? '' : ';border:1px dashed var(--text3)') + '"></i>' + esc(m.nombre) + '</button>';
    }).join('');
  });
  return html + '</div></div></div>';
}
// onEstado(marcaId|null, busca, abierto) — null en marcaId = no cambió la elegida
var comboCerrar = null;   // el listener de "clic afuera" vivo, si hay alguno

function bindCombo(abierto, onEstado){
  var btn = $('cbBtn'), q = $('cbQ');
  // cada re-render reengancha: saco el listener viejo para no acumular uno por tecla
  if (comboCerrar){ document.removeEventListener('click', comboCerrar); comboCerrar = null; }
  if (!btn) return;
  btn.onclick = function(ev){ ev.stopPropagation(); onEstado(null, '', !abierto); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function(b){
    b.onclick = function(ev){ ev.stopPropagation(); onEstado(b.dataset.pick, '', false); };
  });
  if (q){
    q.oninput = function(){ onEstado(null, this.value, true); };
    q.onclick = function(ev){ ev.stopPropagation(); };
    if (abierto){
      q.focus();
      q.setSelectionRange(q.value.length, q.value.length);
    }
  }
  if (abierto){
    comboCerrar = function(){
      document.removeEventListener('click', comboCerrar);
      comboCerrar = null;
      onEstado(null, '', false);
    };
    document.addEventListener('click', comboCerrar);
  }
}

// ── rango de meses ─────────────────────────────────────────────────────────
function sumarMes(p, n){
  return mesDe(new Date(Number(p.slice(0, 4)), Number(p.slice(5, 7)) - 1 + n, 1));
}
// meses ofrecidos en los filtros: desde el primer cierre cargado (o un año atrás)
// hasta el último mes cerrado
function mesesDisponibles(){
  var min = mesAnterior(12), max = mesAnterior(1);
  D.mes.forEach(function(r){
    if (r.periodo < min) min = r.periodo;
    if (r.periodo > max) max = r.periodo;
  });
  var out = [], cur = min;
  while (cur <= max){ out.push(cur); cur = sumarMes(cur, 1); }
  return out;
}
function rangoMeses(desde, hasta){
  var out = [], cur = desde;
  while (cur <= hasta && out.length < 120){ out.push(cur); cur = sumarMes(cur, 1); }
  return out.length ? out : [hasta];
}
function selectorRango(pref, desde, hasta){
  var ops = mesesDisponibles();
  function sel(id, val){
    return '<select id="' + id + '">' + ops.map(function(p){
      return '<option value="' + p + '"' + (p === val ? ' selected' : '') + '>' + periodoLabel(p) + '</option>';
    }).join('') + '</select>';
  }
  return '<label>Desde</label>' + sel(pref + 'D', desde) +
         '<label>Hasta</label>' + sel(pref + 'H', hasta) +
         '<span class="rango">' + [3, 6, 12, 24].map(function(n){
           var d = sumarMes(hasta, -(n - 1));
           return '<button class="mini' + (d === desde ? ' on' : '') + '" data-preset="' + n + '">' + n + 'm</button>';
         }).join('') + '</span>';
}
// onCambio(desde, hasta) — se encarga de que desde nunca pase a hasta
function bindRango(pref, desde, hasta, onCambio){
  $(pref + 'D').onchange = function(){ var d = this.value; onCambio(d, hasta < d ? d : hasta); };
  $(pref + 'H').onchange = function(){ var h = this.value; onCambio(desde > h ? h : desde, h); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function(b){
    b.onclick = function(){ onCambio(sumarMes(hasta, -(Number(b.dataset.preset) - 1)), hasta); };
  });
}
// arranca en los últimos 12 meses cerrados
function rangoPorDefecto(){
  var h = mesAnterior(1);
  return {desde: sumarMes(h, -11), hasta: h};
}

// agrupa marcas por célula; las que no tienen quedan siempre al final
function agruparPorCelula(marcas){
  var grupos = {};
  marcas.forEach(function(m){
    var c = celulaDe(m.id);
    if (!grupos[c.id]) grupos[c.id] = {celula: c, marcas: []};
    grupos[c.id].marcas.push(m);
  });
  return Object.keys(grupos).map(function(k){ return grupos[k]; })
    .sort(function(a, b){
      if (a.celula.id === 0) return 1;
      if (b.celula.id === 0) return -1;
      return a.celula.nombre.localeCompare(b.celula.nombre);
    });
}
// solo las células que hoy tienen alguna marca, más el cajón "Sin célula" si aplica
function celulasConMarcas(){
  var usadas = {};
  D.marcas.forEach(function(m){ usadas[celulaDe(m.id).id] = true; });
  var out = D.celulas.filter(function(c){ return usadas[c.id]; });
  if (usadas[0]) out.push({id: 0, nombre: 'Sin célula', kam: null});
  return out;
}

// ══ CARGA MENSUAL ═════════════════════════════════════════════════════════
var cgPeriodo = null;

function renderCarga(){
  if (!cgPeriodo) cgPeriodo = mesAnterior(1);
  var opciones = ultimosMeses(18).slice().reverse();
  if (opciones.indexOf(cgPeriodo) < 0) opciones.unshift(cgPeriodo);

  var marcas = D.marcas.filter(function(m){ return m.activa; });
  var cargadas = marcas.filter(function(m){ return regDe(m.id, cgPeriodo); }).length;

  var html = '';
  html += '<div class="filters">' +
    '<label>Mes cerrado</label><select id="cgP">' +
      opciones.map(function(p){ return '<option value="' + p + '"' + (p === cgPeriodo ? ' selected' : '') + '>' +
        periodoLargo(p) + '</option>'; }).join('') +
    '</select>' +
    '<div class="spacer"></div>' +
    '<span class="chip ' + (cargadas === marcas.length ? 'green' : 'amber') + '">' +
      cargadas + ' de ' + marcas.length + ' cargadas</span>' +
  '</div>';

  if (me.rol === 'lector')
    html += '<div class="note blue">Tu usuario es de solo lectura: podés ver todo el histórico pero no cargar cierres.</div>';
  else if (me.rol === 'analista' && !D.misMarcas.length)
    html += '<div class="note">Todavía no tenés marcas asignadas. Pedile a un admin que te las asigne en la solapa Accesos.</div>';

  html += '<div class="section"><div class="section-hdr"><span class="section-title">' +
    periodoLargo(cgPeriodo) + '</span></div><div class="twrap"><table><thead><tr>' +
    '<th>Marca</th><th>Estado</th><th>Servicios</th><th class="num">Facturación</th>' +
    '<th class="num">Órdenes</th><th class="num">Sesiones</th><th>Última carga</th><th></th>' +
  '</tr></thead><tbody>';

  if (!marcas.length) html += '<tr><td colspan="8"><div class="empty">No hay marcas activas cargadas</div></td></tr>';

  marcas.forEach(function(m){
    var r = regDe(m.id, cgPeriodo);
    var edit = puedeEditar(m.id);
    var srvs = detDe(m.id, cgPeriodo);
    html += '<tr class="clickable" data-m="' + m.id + '">' +
      '<td class="strong">' + esc(m.nombre) + '</td>' +
      '<td>' + (r ? '<span class="sem sem-' + r.estado + '" style="display:inline-block">' + ELABEL[r.estado] + '</span>'
                  : '<span class="chip grey">pendiente</span>') + '</td>' +
      '<td>' + (r ? semRes(r) : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + devCell(r && r.fact_desvio) + '</td>' +
      '<td class="num">' + devCell(r && r.ord_desvio) + '</td>' +
      '<td class="num">' + devCell(r && r.ses_desvio) + '</td>' +
      '<td class="muted" style="font-size:11.5px">' + (r && r.actualizado_at
          ? esc((r.cargado_por || '') + ' · ' + new Date(r.actualizado_at).toLocaleDateString('es-AR')) : '—') + '</td>' +
      '<td style="text-align:right"><button class="mini' + (r ? '' : ' on') + '">' +
        (edit ? (r ? 'Editar' : 'Cargar') : 'Ver') + '</button></td>' +
    '</tr>';
  });
  html += '</tbody></table></div></div>';

  $('panes').innerHTML = '<div class="pane active">' + html + '</div>';
  $('cgP').onchange = function(){ cgPeriodo = this.value; renderCarga(); };
  Array.prototype.forEach.call(document.querySelectorAll('tr[data-m]'), function(tr){
    tr.onclick = function(){ abrirCierre(Number(tr.dataset.m), cgPeriodo); };
  });
}
function semRes(r){
  var out = [];
  if (r.n_verde)    out.push('<span class="chip green">' + r.n_verde + '</span>');
  if (r.n_amarillo) out.push('<span class="chip amber">' + r.n_amarillo + '</span>');
  if (r.n_rojo)     out.push('<span class="chip red">' + r.n_rojo + '</span>');
  if (r.n_sin)      out.push('<span class="chip grey">' + r.n_sin + ' s/serv</span>');
  return out.join(' ') || '<span class="muted">—</span>';
}
function devCell(v){
  if (v == null) return '<span class="muted">—</span>';
  return '<span class="' + (Number(v) >= 0 ? 'dev-ok' : 'dev-bad') + '">' + fmtPct(v) + '</span>';
}

// ══ POR MARCA ═════════════════════════════════════════════════════════════
var pmMarca = '', pmBusca = '', pmEstado = '', pmRango = null, pmAbierto = false;

function renderPorMarca(){
  if (!pmRango) pmRango = rangoPorDefecto();
  var activas = D.marcas.filter(function(m){ return m.activa; });
  if (!pmMarca && activas.length) pmMarca = String(activas[0].id);
  var m = D.marcaById[Number(pmMarca)];
  var meses = rangoMeses(pmRango.desde, pmRango.hasta);
  var mesRef = meses[meses.length - 1];

  var html = '<div class="filters">' +
    comboMarcas(pmMarca, pmBusca, pmAbierto, mesRef) +
    selectorRango('pm', pmRango.desde, pmRango.hasta) +
  '</div>';

  function enganchar(){
    bindCombo(pmAbierto, function(id, busca, abierto){
      if (id) pmMarca = id;
      pmBusca = busca; pmAbierto = abierto;
      renderPorMarca();
    });
    bindRango('pm', pmRango.desde, pmRango.hasta, function(d, h){
      pmRango = {desde: d, hasta: h}; renderPorMarca();
    });
  }

  if (!m){
    $('panes').innerHTML = '<div class="pane active">' + html + '<div class="empty">No hay marcas cargadas</div></div>';
    enganchar();
    return;
  }

  var c = celulaDe(m.id);
  var srvs = serviciosDe(m.id);
  // los cierres dentro del rango elegido, del más nuevo al más viejo
  var cierres = D.mes.filter(function(r){
                       return r.marca_id === m.id && meses.indexOf(r.periodo) >= 0; })
                     .sort(function(a,b){ return a.periodo < b.periodo ? 1 : -1; });
  var ult = cierres[0];

  html += '<div class="section" style="padding:16px 20px">' +
    '<div class="resumen" style="border:none;background:transparent;padding:0">' +
      '<div class="resumen-dot ' + (ult ? ult.estado : 'sin_servicio') + '"></div>' +
      '<div class="resumen-txt">' +
        '<div class="resumen-est" style="font-size:19px">' + esc(m.nombre) + '</div>' +
        '<div class="resumen-sub">' + esc(c.nombre) + (c.kam ? ' · KAM ' + esc(c.kam) : '') +
          ' · ' + srvs.length + ' servicio' + (srvs.length === 1 ? '' : 's') +
          ' · ' + cierres.length + ' mes' + (cierres.length === 1 ? '' : 'es') + ' cargado' + (cierres.length === 1 ? '' : 's') +
        '</div>' +
      '</div>' +
      (ult ? '<div style="text-align:right"><div class="chip ' + chipDe(ult.estado) + '">' + ELABEL[ult.estado] + '</div>' +
             '<div class="resumen-sub" style="margin-top:5px">' + periodoLargo(ult.periodo) + '</div></div>' : '') +
    '</div></div>';

  if (ult){
    html += '<div class="kpi-row">' +
      kpi('Facturación', fmtPct(ult.fact_desvio), 'objetivo ' + fmtN(ult.fact_obj) + ' · real ' + fmtN(ult.fact_real),
          ult.fact_desvio == null ? 'mute' : (ult.fact_desvio >= 0 ? 'ok' : 'bad')) +
      kpi('Órdenes', fmtPct(ult.ord_desvio), 'objetivo ' + fmtN(ult.ord_obj) + ' · real ' + fmtN(ult.ord_real),
          ult.ord_desvio == null ? 'mute' : (ult.ord_desvio >= 0 ? 'ok' : 'bad')) +
      kpi('Sesiones', fmtPct(ult.ses_desvio), 'objetivo ' + fmtN(ult.ses_obj) + ' · real ' + fmtN(ult.ses_real),
          ult.ses_desvio == null ? 'mute' : (ult.ses_desvio >= 0 ? 'ok' : 'bad')) +
    '</div>';
  }

  // grilla servicios × meses de esta marca
  var vistos = {};
  srvs.forEach(function(s){ vistos[s.id] = true; });
  D.det.forEach(function(d){
    if (d.marca_id === m.id && meses.indexOf(d.periodo) >= 0) vistos[d.servicio_id] = true;
  });
  var lista = Object.keys(vistos).map(function(id){ return D.servicioById[Number(id)]; })
    .filter(Boolean).sort(function(a,b){ return a.orden - b.orden; });

  // estado de cada servicio en el mes de referencia, para contar y filtrar
  function estadoSrv(sid){
    var r = regDe(m.id, mesRef);
    if (!r) return null;
    var d = D.det.find(function(x){
      return x.marca_id === m.id && x.periodo === mesRef && x.servicio_id === sid; });
    return d ? d.estado : 'sin_servicio';
  }
  var cnt = {todos: lista.length, verde:0, amarillo:0, rojo:0, sin_servicio:0};
  lista.forEach(function(s){ var e = estadoSrv(s.id); if (e) cnt[e]++; });
  var visibles = lista.filter(function(s){ return !pmEstado || estadoSrv(s.id) === pmEstado; });

  html += '<div class="section"><div class="section-hdr"><span class="section-title">Semáforo por servicio</span></div>' +
    '<div style="padding:14px 18px 0">' +
      chipsEstado(pmEstado, 'Servicios en ' + periodoLabel(mesRef), cnt) + '</div>' +
    '<div class="twrap"><table class="grid"><thead><tr><th>Servicio</th>' +
    meses.map(function(p){ return '<th style="text-align:center">' + periodoLabel(p) + '</th>'; }).join('') +
    '</tr></thead><tbody>';
  html += '<tr><td class="strong">Marca (peor servicio)</td>' + meses.map(function(p){
      var r = regDe(m.id, p);
      return '<td class="cell">' + celda(r ? r.estado : null, m.id, p, r && r.estado_forzado) + '</td>';
    }).join('') + '</tr>';
  if (!lista.length)
    html += '<tr><td colspan="' + (meses.length + 1) + '"><div class="empty">Esta marca todavía no tiene servicios asignados</div></td></tr>';
  else if (!visibles.length)
    html += '<tr><td colspan="' + (meses.length + 1) + '"><div class="empty">Ningún servicio quedó en ' +
      ELABEL[pmEstado].toLowerCase() + ' en ' + periodoLargo(mesRef) + '</div></td></tr>';
  visibles.forEach(function(s){
    html += '<tr class="srow"><td>' + esc(s.nombre) + '</td>' + meses.map(function(p){
      var d = D.det.find(function(x){ return x.marca_id === m.id && x.periodo === p && x.servicio_id === s.id; });
      var r = regDe(m.id, p);
      return '<td class="cell">' + celda(r ? (d ? d.estado : 'sin_servicio') : null, m.id, p) + '</td>';
    }).join('') + '</tr>';
  });
  html += '</tbody></table></div></div>';

  // el relato mes a mes: qué pasó y qué se hizo
  html += '<div class="section"><div class="section-hdr"><span class="section-title">Historia mes a mes</span></div>' +
    '<div style="padding:16px 20px">';
  if (!cierres.length) html += '<div class="empty">Ningún cierre cargado entre ' +
    periodoLargo(pmRango.desde) + ' y ' + periodoLargo(pmRango.hasta) + '</div>';
  cierres.forEach(function(r){
    var nc = D.coment.filter(function(k){ return k.registro_id === r.registro_id; }).length;
    html += '<div class="qbox" style="border-left-color:' + colorDe(r.estado) + '">' +
      '<div class="qhdr"><span class="qnum" style="background:' + colorDe(r.estado) + '">' +
        ELABEL[r.estado].charAt(0) + '</span>' +
      '<div class="qlab">' + periodoLargo(r.periodo) +
        '<div class="qsub">' + [
          'Fact ' + fmtPct(r.fact_desvio), 'Órd ' + fmtPct(r.ord_desvio), 'Ses ' + fmtPct(r.ses_desvio)
        ].join(' · ') + (nc ? ' · ' + nc + ' comentario' + (nc === 1 ? '' : 's') : '') + '</div>' +
      '</div>' +
      '<button class="mini" data-abrir="' + m.id + '|' + r.periodo + '">Ver</button></div>' +
      [['1', r.q1], ['2', r.q2], ['3', r.q3]].map(function(q){
        return '<div style="margin-bottom:7px"><span class="qsub" style="font-weight:700">' + q[0] + '.</span> ' +
          '<span class="qview' + (q[1] ? '' : ' vacio') + '">' + (esc(q[1]) || 'sin responder') + '</span></div>';
      }).join('') +
      (r.plan_accion ? '<div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--border2)">' +
        '<span class="qsub" style="font-weight:700;color:var(--blue)">PLAN DE ACCIÓN</span> ' +
        '<span class="qview">' + esc(r.plan_accion) + '</span></div>' : '') +
    '</div>';
  });
  html += '</div></div>';

  $('panes').innerHTML = '<div class="pane active">' + html + '</div>';
  enganchar();
  bindChips(function(e){ pmEstado = e; renderPorMarca(); });
  bindCeldas();
  Array.prototype.forEach.call(document.querySelectorAll('[data-abrir]'), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var p = b.dataset.abrir.split('|');
      abrirCierre(Number(p[0]), p[1]);
    };
  });
}

function colorDe(estado){
  return {verde:'#16a34a', amarillo:'#f59e0b', rojo:'#dc2626'}[estado] || 'var(--text3)';
}
function chipDe(estado){
  return {verde:'green', amarillo:'amber', rojo:'red'}[estado] || 'grey';
}

// ══ POR SERVICIO ══════════════════════════════════════════════════════════
var psServicio = '', psSoloConServicio = true, psEstado = '', psRango = null;

function renderPorServicio(){
  if (!psRango) psRango = rangoPorDefecto();
  if (!psServicio && D.servicios.length) psServicio = String(D.servicios[0].id);
  var s = D.servicioById[Number(psServicio)];
  var meses = rangoMeses(psRango.desde, psRango.hasta);
  var ultimo = meses[meses.length - 1];

  var html = '<div class="filters">' +
    '<label>Servicio</label><select id="psS">' +
      D.servicios.map(function(x){ return '<option value="' + x.id + '"' + (psServicio == x.id ? ' selected' : '') +
        '>' + esc(x.nombre) + '</option>'; }).join('') +
    '</select>' +
    selectorRango('ps', psRango.desde, psRango.hasta) +
    '<label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text2)">' +
      '<input type="checkbox" id="psC"' + (psSoloConServicio ? ' checked' : '') + '> solo marcas con el servicio</label>' +
  '</div>';

  // marcas que tienen el servicio contratado hoy, o que lo tuvieron en el histórico visible
  var conServicio = {};
  D.ms.forEach(function(x){ if (x.servicio_id === Number(psServicio)) conServicio[x.marca_id] = true; });
  D.det.forEach(function(d){
    if (d.servicio_id === Number(psServicio) && d.estado !== 'sin_servicio' && meses.indexOf(d.periodo) >= 0)
      conServicio[d.marca_id] = true;
  });
  var marcas = D.marcas.filter(function(m){
    if (!m.activa) return false;
    return psSoloConServicio ? !!conServicio[m.id] : true;
  });

  // estado de este servicio en el último mes cerrado
  function estadoServicio(marcaId, periodo){
    var d = D.det.find(function(x){
      return x.marca_id === marcaId && x.periodo === periodo && x.servicio_id === Number(psServicio); });
    var r = regDe(marcaId, periodo);
    if (!r) return null;
    return d ? d.estado : 'sin_servicio';
  }
  var cnt = {todos: marcas.length, verde:0, amarillo:0, rojo:0, sin_servicio:0}, sinCargar = 0;
  marcas.forEach(function(m){
    var e = estadoServicio(m.id, ultimo);
    if (e == null) sinCargar++; else cnt[e]++;
  });

  html += '<div class="kpi-row">' +
    kpi('Verde', cnt.verde, esc(s ? s.nombre : '') + ' · ' + periodoLargo(ultimo), 'ok') +
    kpi('Amarillo', cnt.amarillo, periodoLargo(ultimo), 'warn') +
    kpi('Rojo', cnt.rojo, periodoLargo(ultimo), 'bad') +
    kpi('Sin servicio', cnt.sin_servicio, 'ese mes', 'mute') +
    kpi('Sin cargar', sinCargar, 'de ' + marcas.length + ' marcas', sinCargar ? 'mute' : 'ok') +
  '</div>';

  var visibles = marcas.filter(function(m){
    return !psEstado || estadoServicio(m.id, ultimo) === psEstado;
  });

  html += '<div class="section"><div class="section-hdr"><span class="section-title">' +
    esc(s ? s.nombre : '') + ' — ' + visibles.length + ' marca' + (visibles.length === 1 ? '' : 's') + '</span></div>' +
    '<div style="padding:14px 18px 0">' +
      chipsEstado(psEstado, 'Marcas en ' + periodoLabel(ultimo), cnt) + '</div>' +
    '<div class="twrap"><table class="grid"><thead><tr><th>Marca</th>' +
    meses.map(function(p){ return '<th style="text-align:center">' + periodoLabel(p) + '</th>'; }).join('') +
    '</tr></thead><tbody>';

  if (!marcas.length)
    html += '<tr><td colspan="' + (meses.length + 1) + '"><div class="empty">Ninguna marca tiene este servicio asignado</div></td></tr>';
  else if (!visibles.length)
    html += '<tr><td colspan="' + (meses.length + 1) + '"><div class="empty">Ninguna marca quedó en ' +
      ELABEL[psEstado].toLowerCase() + ' en ' + periodoLargo(ultimo) + '</div></td></tr>';

  agruparPorCelula(visibles).forEach(function(g){
    html += '<tr class="crow"><td><span class="crow-name">' + esc(g.celula.nombre) + '</span>' +
      (g.celula.kam ? '<span class="crow-kam">KAM ' + esc(g.celula.kam) + '</span>' : '') +
      '</td><td colspan="' + meses.length + '"></td></tr>';
    g.marcas.forEach(function(m){
      html += '<tr><td class="strong">' + esc(m.nombre) + '</td>' + meses.map(function(p){
        return '<td class="cell">' + celda(estadoServicio(m.id, p), m.id, p) + '</td>';
      }).join('') + '</tr>';
    });
  });
  html += '</tbody></table></div></div>';

  $('panes').innerHTML = '<div class="pane active">' + html + '</div>';
  $('psS').onchange = function(){ psServicio = this.value; renderPorServicio(); };
  bindRango('ps', psRango.desde, psRango.hasta, function(d, h){
    psRango = {desde: d, hasta: h}; renderPorServicio();
  });
  $('psC').onchange = function(){ psSoloConServicio = this.checked; renderPorServicio(); };
  bindChips(function(e){ psEstado = e; renderPorServicio(); });
  bindCeldas();
}

// ══ POR ESTADO ════════════════════════════════════════════════════════════
var flEstado = 'amarillo', flPeriodo = '', flServicio = '', flMarca = '', flQ = '', flCelula = '';

function renderEstados(){
  if (flPeriodo === '') flPeriodo = mesAnterior(1);
  // el mes por defecto puede no tener nada cargado todavía: igual va en la lista,
  // si no el filtro queda aplicado sin que se vea en el select
  var periodos = Array.from(new Set(
      D.mes.map(function(r){ return r.periodo; })
        .concat(D.det.map(function(d){ return d.periodo; }))
        .concat(flPeriodo === 'todos' ? [] : [flPeriodo])
    )).sort().reverse();

  var rows = D.det.filter(function(d){
    if (flEstado && d.estado !== flEstado) return false;
    if (flPeriodo !== 'todos' && d.periodo !== flPeriodo) return false;
    if (flServicio && d.servicio_id !== Number(flServicio)) return false;
    if (flMarca && d.marca_id !== Number(flMarca)) return false;
    if (flCelula && String(celulaDe(d.marca_id).id) !== flCelula) return false;
    if (flQ){
      var hay = (d.marca + ' ' + d.servicio + ' ' + (d.q1||'') + ' ' + (d.q2||'') + ' ' +
                 (d.q3||'') + ' ' + (d.nota||'')).toLowerCase();
      if (hay.indexOf(flQ.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function(a,b){
    if (a.periodo !== b.periodo) return a.periodo < b.periodo ? 1 : -1;
    if (a.marca !== b.marca) return a.marca < b.marca ? -1 : 1;
    return a.servicio_orden - b.servicio_orden;
  });

  var html = '';
  html += '<div class="filters">' +
    '<label>Estado</label><select id="flE">' +
      '<option value="">Todos</option>' +
      ESTADOS.map(function(e){ return '<option value="' + e + '"' + (flEstado === e ? ' selected' : '') + '>' +
        ELABEL[e] + '</option>'; }).join('') +
    '</select>' +
    '<label>Mes</label><select id="flP"><option value="todos"' + (flPeriodo === 'todos' ? ' selected' : '') + '>Todos</option>' +
      periodos.map(function(p){ return '<option value="' + p + '"' + (flPeriodo === p ? ' selected' : '') + '>' +
        periodoLargo(p) + '</option>'; }).join('') +
    '</select>' +
    '<label>Servicio</label><select id="flS"><option value="">Todos</option>' +
      D.servicios.map(function(s){ return '<option value="' + s.id + '"' + (flServicio == s.id ? ' selected' : '') + '>' +
        esc(s.nombre) + '</option>'; }).join('') +
    '</select>' +
    '<label>Célula</label><select id="flC"><option value="">Todas</option>' +
      celulasConMarcas().map(function(c){ return '<option value="' + c.id + '"' + (flCelula == c.id ? ' selected' : '') +
        '>' + esc(c.nombre) + '</option>'; }).join('') +
    '</select>' +
    '<label>Marca</label><select id="flM"><option value="">Todas</option>' +
      D.marcas.map(function(m){ return '<option value="' + m.id + '"' + (flMarca == m.id ? ' selected' : '') + '>' +
        esc(m.nombre) + '</option>'; }).join('') +
    '</select>' +
    '<input type="search" id="flQ" placeholder="Buscar en las respuestas…" value="' + esc(flQ) + '">' +
    '<div class="spacer"></div>' +
    '<button class="btn-sm" id="flCsv">Exportar CSV</button>' +
  '</div>';

  var c = {verde:0, amarillo:0, rojo:0, sin_servicio:0};
  rows.forEach(function(r){ c[r.estado]++; });
  html += '<div class="kpi-row">' +
    kpi('Resultados', rows.length, 'filas marca × servicio', 'mute') +
    kpi('Verde', c.verde, '', 'ok') +
    kpi('Amarillo', c.amarillo, '', 'warn') +
    kpi('Rojo', c.rojo, '', 'bad') +
  '</div>';

  html += '<div class="section"><div class="twrap"><table><thead><tr>' +
    '<th>Mes</th><th>Marca</th><th>Célula</th><th>Servicio</th><th>Estado</th>' +
    '<th>¿Por qué ese color?</th><th>¿Qué se está haciendo?</th><th>Foco del cliente</th><th>Plan de acción</th>' +
  '</tr></thead><tbody>';

  if (!rows.length) html += '<tr><td colspan="9"><div class="empty">Nada que mostrar con estos filtros</div></td></tr>';

  rows.forEach(function(r){
    var c = celulaDe(r.marca_id);
    html += '<tr class="clickable" data-m="' + r.marca_id + '" data-p="' + r.periodo + '">' +
      '<td class="muted" style="white-space:nowrap">' + periodoLabel(r.periodo) + '</td>' +
      '<td class="strong">' + esc(r.marca) + '</td>' +
      '<td class="muted" style="font-size:11.5px">' + esc(c.nombre) +
        (c.kam ? '<br>' + esc(c.kam) : '') + '</td>' +
      '<td>' + esc(r.servicio) + '</td>' +
      '<td><span class="sem sem-' + r.estado + '" style="display:inline-block">' + ELABEL[r.estado] + '</span></td>' +
      '<td><div class="wrap-cell">' + (esc(r.q1) || '<span class="muted">—</span>') + '</div></td>' +
      '<td><div class="wrap-cell">' + (esc(r.q2) || '<span class="muted">—</span>') + '</div></td>' +
      '<td><div class="wrap-cell">' + (esc(r.q3) || '<span class="muted">—</span>') + '</div></td>' +
      '<td><div class="wrap-cell">' + (esc(r.plan_accion) || '<span class="muted">—</span>') + '</div></td>' +
    '</tr>';
  });
  html += '</tbody></table></div></div>';

  $('panes').innerHTML = '<div class="pane active">' + html + '</div>';
  $('flE').onchange = function(){ flEstado = this.value; renderEstados(); };
  $('flP').onchange = function(){ flPeriodo = this.value; renderEstados(); };
  $('flS').onchange = function(){ flServicio = this.value; renderEstados(); };
  $('flC').onchange = function(){ flCelula = this.value; renderEstados(); };
  $('flM').onchange = function(){ flMarca = this.value; renderEstados(); };
  $('flQ').oninput  = function(){ flQ = this.value; renderEstados(); };
  $('flCsv').onclick = function(){ exportarCsv(rows); };
  Array.prototype.forEach.call(document.querySelectorAll('tr[data-m][data-p]'), function(tr){
    tr.onclick = function(){ abrirCierre(Number(tr.dataset.m), tr.dataset.p); };
  });
}

function exportarCsv(rows){
  var cab = ['Mes','Marca','Célula','KAM','Servicio','Estado','Nota del servicio',
             PREGUNTAS[0], PREGUNTAS[1], PREGUNTAS[2], 'Plan de acción'];
  var q = function(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var csv = [cab.map(q).join(';')].concat(rows.map(function(r){
    var c = celulaDe(r.marca_id);
    return [r.periodo.slice(0,7), r.marca, c.nombre, c.kam, r.servicio, ELABEL[r.estado], r.nota,
            r.q1, r.q2, r.q3, r.plan_accion].map(q).join(';');
  })).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'semaforo-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderMarcas(){
  var html = '<div class="note">Sacar una marca no borra su histórico: se marca como baja y deja de pedir carga mensual. ' +
    'Sacarle un servicio tampoco borra los meses ya cargados.</div>';

    '<button class="btn-orange" id="nmAdd">Agregar</button></div></div>';

  // células: alta y quién las lleva

    D.celulas.length + ' células</span></div>' +
    '<div class="addrow"><input id="ncNombre" placeholder="Nombre de la célula">' +
    '<input id="ncKam" placeholder="KAM que la lleva">' +
    '<button class="btn-orange" id="ncAdd">Agregar célula</button></div>';
  if (D.celulas.length){
    html += '<div class="twrap"><table><thead><tr><th>Célula</th><th>KAM</th><th>Marcas</th><th></th>' +
      '</tr></thead><tbody>';
    D.celulas.forEach(function(c){

      html += '<tr><td class="strong">' + esc(c.nombre) + '</td>' +
        '<td><input class="srv-nota" data-kam="' + c.id + '" style="max-width:200px" value="' +
          esc(c.kam || '') + '" placeholder="sin asignar"></td>' +
        '<td class="num">' + n + '</td>' +
        '<td style="text-align:right">' +
          (n === 0 ? '<button class="mini danger" data-del-celula="' + c.id + '">Eliminar</button>' : '') +
        '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  html += '<div class="section"><div class="section-hdr"><span class="section-title">' +
    D.marcas.length + ' marcas</span></div><div class="twrap"><table><thead><tr>' +
    '<th>Marca</th><th>Célula</th><th>Servicios contratados</th><th>Meses cargados</th><th></th>' +
  '</tr></thead><tbody>';

  if (!D.marcas.length) html += '<tr><td colspan="5"><div class="empty">Todavía no hay marcas</div></td></tr>';

  D.marcas.forEach(function(m){
    var ids = D.ms.filter(function(x){ return x.marca_id === m.id; }).map(function(x){ return x.servicio_id; });
    var meses = D.mes.filter(function(r){ return r.marca_id === m.id; }).length;
    html += '<tr><td class="strong">' + esc(m.nombre) +
      (m.activa ? '' : ' <span class="chip grey">baja</span>') + '</td>' +
      '<td><select class="mini" data-celula="' + m.id + '" style="padding:5px 8px">' +
        '<option value="">— sin célula —</option>' +
        D.celulas.map(function(c){
          return '<option value="' + c.id + '"' + (m.celula_id === c.id ? ' selected' : '') + '>' +
            esc(c.nombre) + '</option>'; }).join('') +
      '</select></td>' +
      '<td>' + D.servicios.map(function(s){
        return '<button class="mini' + (ids.indexOf(s.id) >= 0 ? ' on' : '') + '" data-srv="' + m.id + ':' + s.id +
          '" style="margin:2px 3px 2px 0">' + esc(s.nombre) + '</button>';
      }).join('') + '</td>' +
      '<td class="num">' + meses + '</td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        '<button class="mini" data-toggle-marca="' + m.id + '">' + (m.activa ? 'Dar de baja' : 'Reactivar') + '</button> ' +
        (meses === 0 ? '<button class="mini danger" data-del-marca="' + m.id + '">Eliminar</button>' : '') +
      '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  $('panes').innerHTML = '<div class="pane active">' + html + '</div>';

  $('nmAdd').onclick = function(){
    var nombre = $('nmNombre').value.trim();
    if (!nombre) return;
    sb.from('sem_marcas').insert({nombre: nombre}).then(function(r){
      if (r.error) return toast(r.error.message, true);
      toast('Marca agregada'); cargar();
    });
  };
  $('nmNombre').onkeydown = function(ev){ if (ev.key === 'Enter') $('nmAdd').click(); };

  $('ncAdd').onclick = function(){
    var nombre = $('ncNombre').value.trim();
    if (!nombre) return;
    sb.from('sem_celulas').insert({nombre: nombre, kam: $('ncKam').value.trim() || null}).then(function(r){
      if (r.error) return toast(r.error.message, true);
      toast('Célula agregada'); cargar();
    });
  };
  $('ncNombre').onkeydown = function(ev){ if (ev.key === 'Enter') $('ncAdd').click(); };

  Array.prototype.forEach.call(document.querySelectorAll('[data-celula]'), function(s){
    s.onchange = function(){
      var mid = Number(s.dataset.celula);
      sb.from('sem_marcas').update({celula_id: s.value ? Number(s.value) : null}).eq('id', mid)
        .then(function(r){
          if (r.error) return toast(r.error.message, true);
          toast('Célula asignada'); cargar();
        });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-kam]'), function(i){
    i.onchange = function(){
      sb.from('sem_celulas').update({kam: i.value.trim() || null}).eq('id', Number(i.dataset.kam))
        .then(function(r){
          if (r.error) return toast(r.error.message, true);
          toast('KAM actualizado'); cargar();
        });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del-celula]'), function(b){
    b.onclick = function(){
      var id = Number(b.dataset.delCelula);
      if (!confirm('¿Eliminar la célula "' + D.celulaById[id].nombre + '"? No tiene marcas asignadas.')) return;
      sb.from('sem_celulas').delete().eq('id', id).then(function(r){
        if (r.error) return toast(r.error.message, true);
        toast('Célula eliminada'); cargar();

  Array.prototype.forEach.call(document.querySelectorAll('[data-srv]'), function(b){

      var p = b.dataset.srv.split(':'), mid = Number(p[0]), sid = Number(p[1]);
      var tiene = b.classList.contains('on');
      var op = tiene
        ? sb.from('sem_marca_servicios').delete().eq('marca_id', mid).eq('servicio_id', sid)
        : sb.from('sem_marca_servicios').insert({marca_id: mid, servicio_id: sid});
      op.then(function(r){
        if (r.error) return toast(r.error.message, true);
        cargar();
      });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-marca]'), function(b){
    b.onclick = function(){
      var id = Number(b.dataset.toggleMarca);
      var m = D.marcaById[id];
      sb.from('sem_marcas').update({activa: !m.activa, baja_at: m.activa ? new Date().toISOString().slice(0,10) : null})
        .eq('id', id).then(function(r){
          if (r.error) return toast(r.error.message, true);
          toast(m.activa ? 'Marca dada de baja' : 'Marca reactivada'); cargar();
        });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del-marca]'), function(b){
    b.onclick = function(){
      var id = Number(b.dataset.delMarca);
      if (!confirm('¿Eliminar "' + D.marcaById[id].nombre + '"? No tiene meses cargados.')) return;
      sb.from('sem_marcas').delete().eq('id', id).then(function(r){
        if (r.error) return toast(r.error.message, true);
        toast('Marca eliminada'); cargar();
      });
    };
  });
}
