      });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-rol]'), function(s){
    s.onchange = function(){
      sb.from('sem_usuarios').update({rol: s.value}).eq('id', Number(s.dataset.rol)).then(function(r){
        if (r.error) return toast(r.error.message, true);
        toast('Rol actualizado'); cargar();
      });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-um]'), function(b){
    b.onclick = function(){
      var p = b.dataset.um.split(':'), uid = Number(p[0]), mid = Number(p[1]);
      var tiene = b.classList.contains('on');
      var op = tiene
        ? sb.from('sem_usuario_marcas').delete().eq('usuario_id', uid).eq('marca_id', mid)
        : sb.from('sem_usuario_marcas').insert({usuario_id: uid, marca_id: mid});
      op.then(function(r){
        if (r.error) return toast(r.error.message, true);
        cargar();
      });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-user]'), function(b){
    b.onclick = function(){
      var id = Number(b.dataset.toggleUser);
      var u = D.usuarios.find(function(x){ return x.id === id; });
      sb.from('sem_usuarios').update({activo: !u.activo}).eq('id', id).then(function(r){
        if (r.error) return toast(r.error.message, true);
        cargar();
      });
    };
  });
}

// ══ DRAWER: el cierre de una marca en un mes ══════════════════════════════
function abrirCierre(marcaId, periodo){
  var m = D.marcaById[marcaId];
  var r = regDe(marcaId, periodo);
  var editable = puedeEditar(marcaId);
  var det = detDe(marcaId, periodo);

  // los servicios del formulario: los contratados hoy + los que ya tengan color cargado
  var srvs = serviciosDe(marcaId).slice();
  det.forEach(function(d){
    if (!srvs.some(function(s){ return s.id === d.servicio_id; })){
      var s = D.servicioById[d.servicio_id];
      if (s) srvs.push(s);
    }
  });
  srvs.sort(function(a,b){ return a.orden - b.orden; });

  form = {
    marca_id: marcaId, periodo: periodo, editable: editable,
    registro_id: r ? r.registro_id : null,
    estado_manual: r ? r.estado_manual : null,
    mostrarForzar: !!(r && r.estado_manual),   // el forzado arranca escondido
    q1: r ? (r.q1 || '') : '', q2: r ? (r.q2 || '') : '', q3: r ? (r.q3 || '') : '',
    plan_accion: r ? (r.plan_accion || '') : '',
    fact_obj: r ? r.fact_obj : null, fact_real: r ? r.fact_real : null,
    ord_obj:  r ? r.ord_obj  : null, ord_real:  r ? r.ord_real  : null,
    ses_obj:  r ? r.ses_obj  : null, ses_real:  r ? r.ses_real  : null,
    servicios: srvs.map(function(s){
      var d = det.find(function(x){ return x.servicio_id === s.id; });
      return {id: s.id, nombre: s.nombre, estado: d ? d.estado : 'sin_servicio', nota: d ? (d.nota || '') : ''};
    })
  };

  var c = celulaDe(marcaId);
  $('dName').textContent = m.nombre;
  $('dMeta').innerHTML = periodoLargo(periodo) +
    ' · <span class="muted">' + esc(c.nombre) + (c.kam ? ' · KAM ' + esc(c.kam) : '') + '</span>' +
    (r ? ' · <span class="muted">cargado por ' + esc(r.cargado_por || '—') + '</span>'
       : ' · <span class="muted">sin cargar</span>') +
    (editable ? '' : ' · <span class="chip grey">solo lectura</span>');
  pintarDrawer();
  $('drawer').classList.add('open');
  $('drawerBg').classList.add('open');
}

function pintarDrawer(){
  var f = form;
  var calc = peor(f.servicios.map(function(s){ return s.estado; }));
  var vigente = f.estado_manual || calc;
  var html = '';

  // 1) los servicios primero: es lo que realmente se carga
  html += '<div class="dsec">Semáforo de cada servicio</div>';
  if (!f.servicios.length)
    html += '<div class="note">Esta marca no tiene servicios asignados. Cargalos en la solapa Marcas.</div>';
  f.servicios.forEach(function(s, i){
    html += '<div class="srv ' + (s.estado === 'sin_servicio' ? 'pend' : 'set-' + s.estado) + '">' +
      '<span class="srv-name">' + esc(s.nombre) + '</span>';
    if (f.editable){
      html += '<div class="seg big">' + ESTADOS.map(function(e){
        return '<button class="' + e + (s.estado === e ? ' on' : '') + '" data-est="' + i + ':' + e + '">' +
          (e === 'sin_servicio' ? 'S/serv' : ELABEL[e]) + '</button>'; }).join('') + '</div>' +
        '<input class="srv-nota" data-nota="' + i + '" placeholder="Nota del servicio (opcional)" value="' +
          esc(s.nota) + '">';
    } else {
      html += '<span class="sem sem-' + s.estado + '" style="display:inline-block">' + ELABEL[s.estado] + '</span>';
      if (s.nota) html += '<div style="width:100%;font-size:12px;color:var(--text2);margin-top:4px">' + esc(s.nota) + '</div>';
    }
    html += '</div>';
  });

  // 2) el color de la marca sale solo de lo de arriba; forzarlo es la excepción
  html += '<div class="dsec">Semáforo de la marca</div>';
  html += '<div class="resumen">' +
    '<div class="resumen-dot ' + vigente + '"></div>' +
    '<div class="resumen-txt"><div class="resumen-est">' + ELABEL[vigente] + '</div>' +
    '<div class="resumen-sub">' +
      (f.estado_manual
        ? 'forzado a mano · por servicios daría ' + ELABEL[calc]
        : 'calculado automáticamente: el peor de los ' + f.servicios.length + ' servicios') +
    '</div></div>' +
    (f.editable && !f.mostrarForzar
      ? '<button class="link-mini" data-forzar-toggle="1">forzar otro color</button>' : '') +
  '</div>';
  if (f.editable && f.mostrarForzar){
    html += '<div style="display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap">' +
      '<span class="qsub">Forzar a:</span><div class="seg">' +
      ['verde','amarillo','rojo'].map(function(e){
        return '<button class="' + e + (f.estado_manual === e ? ' on' : '') + '" data-force="' + e + '">' +
          ELABEL[e] + '</button>'; }).join('') +
      '<button data-force="">Volver a automático</button></div></div>';
  }

  // 3) bloques de números
  html += '<div class="dsec">Desvío vs objetivo</div><div class="metric-row">' +
    metricBox('Facturación', 'fact', 0) +
    metricBox('Órdenes', 'ord', 0) +
    metricBox('Sesiones', 'ses', 0) +
  '</div>';

  // 4) las preguntas, cada una como tarjeta numerada
  var resp = ['q1','q2','q3'].filter(function(k){ return (f[k] || '').trim(); }).length;
  html += '<div class="dsec">Las 3 preguntas del cierre' +
    '<span style="float:right;color:' + (resp === 3 ? 'var(--green)' : 'var(--text3)') + '">' +
      resp + '/3 respondidas</span></div>';
  ['q1','q2','q3'].forEach(function(k, i){
    html += '<div class="qbox"><div class="qhdr"><span class="qnum">' + (i + 1) + '</span>' +
      '<div class="qlab">' + esc(PREGUNTAS[i]) + '</div></div>';
    html += f.editable
      ? '<textarea class="q" data-q="' + k + '">' + esc(f[k]) + '</textarea>'
      : '<div class="qview' + (f[k] ? '' : ' vacio') + '">' + (esc(f[k]) || 'Sin respuesta') + '</div>';
    html += '</div>';
  });

  // 5) plan de acción + hilo de comentarios
  html += '<div class="dsec">Plan de acción</div>';
  html += '<div class="qbox q-plan"><div class="qhdr"><span class="qnum">&#9873;</span>' +
    '<div class="qlab">Plan de acción de la marca' +
      '<div class="qsub">Qué vamos a hacer este mes, con qué prioridad</div></div></div>';
  html += f.editable
    ? '<textarea class="q" data-q="plan_accion">' + esc(f.plan_accion) + '</textarea>'
    : '<div class="qview' + (f.plan_accion ? '' : ' vacio') + '">' + (esc(f.plan_accion) || 'Sin plan cargado') + '</div>';

  var cmts = f.registro_id
    ? D.coment.filter(function(k){ return k.registro_id === f.registro_id; })
    : [];
  html += '<div style="margin-top:13px;padding-top:12px;border-top:1px solid var(--border2)">' +
    '<div class="cmt-meta" style="margin-bottom:8px">Comentarios (' + cmts.length + ')</div>';
  cmts.forEach(function(k){
    html += '<div class="cmt"><div class="cmt-meta">' + esc(k.autor || 'anónimo') + ' · ' +
      new Date(k.creado_at).toLocaleDateString('es-AR', {day:'2-digit', month:'short', year:'2-digit'}) +
      '</div><div class="cmt-txt">' + esc(k.texto) + '</div></div>';
  });
  if (!cmts.length)
    html += '<div class="qsub" style="margin-bottom:4px">Todavía no hay comentarios.</div>';
  if (f.editable){
    html += f.registro_id
      ? '<div class="cmt-add"><input id="cmtTxt" placeholder="Sumar un comentario…">' +
        '<button class="mini" id="cmtAdd">Agregar</button></div>'
      : '<div class="qsub">Guardá el cierre para poder sumar comentarios.</div>';
  }
  html += '</div></div>';

  $('dBody').innerHTML = html;

  if (f.editable){
    $('dFoot').style.display = 'flex';
    $('dFoot').innerHTML = '<button class="btn-orange" id="dSave">Guardar cierre</button>' +
      '<span class="muted" id="dHint" style="font-size:11.5px">El color de cada servicio queda en el histórico</span>';
    $('dSave').onclick = guardarCierre;
  } else {
    $('dFoot').style.display = 'none';
  }
  bindDrawer();
}

// el desvío solo existe si están los dos números, igual que en la vista de Postgres
function desvio(obj, real){
  if (obj == null || real == null || !(Number(obj) > 0)) return null;
  return (Number(real) - Number(obj)) / Number(obj) * 100;
}

function metricBox(nombre, k, dec){
  var f = form;
  var obj = f[k + '_obj'], real = f[k + '_real'];
  var dev = desvio(obj, real);
  var html = '<div class="metric ' + (dev == null ? '' : (dev >= 0 ? 'up' : 'down')) +
    '" data-metric="' + k + '"><div class="metric-name">' + nombre + '</div>';
  if (f.editable){
    html += '<div class="mlab">Objetivo</div><input type="number" step="any" data-k="' + k + '_obj" value="' +
      (obj == null ? '' : obj) + '">' +
      '<div class="mlab mgap">Real</div><input type="number" step="any" data-k="' + k + '_real" value="' +
      (real == null ? '' : real) + '">';
  } else {
    html += '<div class="metric-view"><span>Objetivo</span><span>' + fmtN(obj, dec) + '</span></div>' +
            '<div class="metric-view"><span>Real</span><span>' + fmtN(real, dec) + '</span></div>';
  }
  html += metricDev(dev) + metricBar(obj, real) +
    '<div class="metric-foot"><span>real</span><span>objetivo</span></div></div>';
  return html;
}

function bindDrawer(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-force]'), function(b){
    b.onclick = function(){ form.estado_manual = b.dataset.force || null; pintarDrawer(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-est]'), function(b){
    b.onclick = function(){
      var p = b.dataset.est.split(':');
      form.servicios[Number(p[0])].estado = p[1];
      pintarDrawer();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-nota]'), function(i){
    i.oninput = function(){ form.servicios[Number(i.dataset.nota)].nota = i.value; };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function(t){
    t.oninput = function(){ form[t.dataset.q] = t.value; };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function(i){
    i.oninput = function(){
      form[i.dataset.k] = i.value === '' ? null : num(i.value);
      // solo repinto el desvío y la barra, para no perder el foco del input
      var k = i.dataset.k.split('_')[0];
      var caja = i.closest('.metric');
      var obj = form[k + '_obj'], real = form[k + '_real'];
      var dev = desvio(obj, real);
      caja.className = 'metric ' + (dev == null ? '' : (dev >= 0 ? 'up' : 'down'));
      caja.querySelector('.metric-dev').outerHTML = metricDev(dev);
      caja.querySelector('.metric-bar').outerHTML = metricBar(obj, real);
    };
  });
  // el forzado del color general está escondido hasta que se pide
  var ft = document.querySelector('[data-forzar-toggle]');
  if (ft) ft.onclick = function(){ form.mostrarForzar = true; pintarDrawer(); };

  if ($('cmtAdd')) $('cmtAdd').onclick = agregarComentario;
  if ($('cmtTxt')) $('cmtTxt').onkeydown = function(ev){ if (ev.key === 'Enter') agregarComentario(); };
}

// el desvío grande con la flecha
function metricDev(dev){
  if (dev == null) return '<div class="metric-dev dev-none">sin dato</div>';
  return '<div class="metric-dev ' + (dev >= 0 ? 'dev-ok' : 'dev-bad') + '">' +
    '<span class="arrow">' + (dev >= 0 ? '&#9650;' : '&#9660;') + '</span>' + fmtPct(dev) + '</div>';
}
// barra del real contra el objetivo; la marca del 100% es el borde derecho
function metricBar(obj, real){
  if (obj == null || real == null || !(Number(obj) > 0)) return '<div class="metric-bar"></div>';
  var pct = Math.max(0, Math.min(100, (Number(real || 0) / Number(obj)) * 100));
  var cls = Number(real || 0) >= Number(obj) ? 'ok' : 'bad';
  return '<div class="metric-bar"><span class="' + cls + '" style="width:' + pct + '%"></span></div>';
}

function agregarComentario(){
  var txt = ($('cmtTxt').value || '').trim();
  if (!txt || !form.registro_id) return;
  $('cmtAdd').disabled = true;
  sb.from('sem_comentarios')
    .insert({registro_id: form.registro_id, autor: me.nombre || me.email, texto: txt})
    .select()
    .then(function(r){
      if (r.error) { $('cmtAdd').disabled = false; return toast(r.error.message, true); }
      D.coment = D.coment.concat(r.data || []);
      toast('Comentario agregado');
      pintarDrawer();
    });
}

function guardarCierre(){
  var f = form;
  $('dSave').disabled = true;
  var payload = {
    marca_id: f.marca_id, periodo: f.periodo, estado_manual: f.estado_manual,
    q1: f.q1 || null, q2: f.q2 || null, q3: f.q3 || null,
    plan_accion: f.plan_accion || null,
    fact_obj: f.fact_obj, fact_real: f.fact_real,
    ord_obj:  f.ord_obj,  ord_real:  f.ord_real,
    ses_obj:  f.ses_obj,  ses_real:  f.ses_real,
    cargado_por: me.nombre || me.email,
    actualizado_at: new Date().toISOString()
  };
  sb.from('sem_registros').upsert(payload, {onConflict: 'marca_id,periodo'}).select()
    .then(function(r){
      if (r.error) throw r.error;
      var reg = r.data[0];
      if (!f.servicios.length) return {error: null};
      var rows = f.servicios.map(function(s){
        return {registro_id: reg.id, servicio_id: s.id, estado: s.estado, nota: s.nota || null};
      });
      return sb.from('sem_detalle').upsert(rows, {onConflict: 'registro_id,servicio_id'});
    })
    .then(function(r){
      if (r && r.error) throw r.error;
      toast('Cierre guardado');
      cerrarDrawer();
      cargar();
    })
    .catch(function(e){
      $('dSave').disabled = false;
      toast(e.message || 'No se pudo guardar', true);
    });
}

function cerrarDrawer(){
  $('drawer').classList.remove('open');
  $('drawerBg').classList.remove('open');
  form = null;
}
$('dClose').onclick = cerrarDrawer;
$('drawerBg').onclick = cerrarDrawer;
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') cerrarDrawer(); });
</script>
