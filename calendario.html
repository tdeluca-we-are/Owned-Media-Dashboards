<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Are — Calendario Owned</title>
<link rel="icon" type="image/png" href="Iso.png">
<link rel="apple-touch-icon" href="Iso.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1929;--bg2:#112240;--bg3:#1a3355;
  --border:rgba(255,255,255,0.18);--border2:rgba(255,255,255,0.15);
  --text:#f0f0f0;--text2:#8892a4;--text3:#3d4f6b;
  --orange:#f04e23;--orange2:#d43d16;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#7a9eca;
  --ch-email:#f04e23;--ch-push:#7a9eca;--ch-wpp:#22c55e;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
}
:root{color-scheme:dark}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
/* casillas con los colores de la app (no las blancas del navegador) */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:1.5px solid rgba(255,255,255,.28);border-radius:4px;background:var(--bg3);cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle;flex-shrink:0;transition:background .12s,border-color .12s}
input[type=checkbox]:hover{border-color:var(--orange)}
input[type=checkbox]:checked{background:var(--orange);border-color:var(--orange)}
input[type=checkbox]:checked::before{content:'';width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
input[type=checkbox]:focus-visible{outline:2px solid rgba(240,78,35,.5);outline-offset:2px}
input[type=checkbox]:disabled{opacity:.4;cursor:default}

/* tarjeta de envío (alta / edición) */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,22,.62);backdrop-filter:blur(3px);z-index:400;display:none;align-items:flex-start;justify-content:center;padding:9vh 16px 24px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{width:min(540px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.m-marca{font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.m-body{padding:10px 18px 4px}
.m-tema{width:100%;font-family:var(--font);font-size:19px;font-weight:700;letter-spacing:-.01em;background:transparent;border:none;outline:none;color:var(--text);padding:8px 0 10px;border-bottom:1px solid var(--border2)}
.m-tema:focus{border-bottom-color:var(--orange)}
.m-tema::placeholder{color:var(--text3)}
.m-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.m-pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 6px 3px 12px;font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.m-pill:focus-within{border-color:var(--orange)}
.m-pill input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12px;padding:4px 2px}
.m-area{width:100%;font-family:var(--font);font-size:13px;line-height:1.5;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;color:var(--text);outline:none;resize:vertical;min-height:62px;margin-top:12px}
.m-area:focus{border-color:var(--orange)}
.m-area::placeholder,.m-in::placeholder{color:var(--text3)}
.m-lab{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.m-more{background:none;border:none;color:var(--text2);font-family:var(--font);font-size:12px;cursor:pointer;padding:12px 0 2px;display:inline-flex;gap:6px;align-items:center}
.m-more:hover{color:var(--orange)}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-in{width:100%;font-family:var(--font);font-size:13px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:9px 12px;color:var(--text);outline:none}
.m-in:focus{border-color:var(--orange)}
.m-foot{display:flex;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid var(--border2);margin-top:14px;flex-wrap:wrap}
.m-link{background:none;border:none;font-family:var(--font);font-size:12px;color:var(--text3);cursor:pointer;padding:4px 2px}
.m-link:hover{color:var(--orange)}
.m-link.del:hover{color:var(--red)}
.m-kbd{font-size:10.5px;color:var(--text3)}
.m-x{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;line-height:1;padding:0 2px}
.m-x:hover{color:var(--orange)}
.seg.pills button{font-size:11.5px;padding:6px 14px;border-radius:20px}
@media (max-width:520px){.m-grid{grid-template-columns:1fr}}

/* auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:40px;width:100%;max-width:380px}
.text-logo-xl{font-size:36px;font-weight:800;letter-spacing:-0.03em;text-align:center;margin-bottom:6px}
.text-logo-sm{font-size:17px;font-weight:800;letter-spacing:-0.02em}
.logo-we{color:#f0f0f0}.logo-are{color:var(--orange)}
.auth-title{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
.fg input,.fg select,.fg textarea{font-family:var(--font);font-size:14px;padding:10px 13px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);outline:none;width:100%}
.fg textarea{min-height:70px;resize:vertical;line-height:1.45;font-size:13px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--orange)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;font-family:var(--font);font-size:14px;font-weight:600;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;margin-top:6px}
.btn-primary:hover{background:var(--orange2)}
.auth-error{font-size:12px;color:var(--orange);text-align:center;margin-top:10px;min-height:18px;line-height:1.45}

/* shell */
.app{display:none;min-height:100vh;flex-direction:column}.app.visible{display:flex}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:200}
.top-left{display:flex;align-items:center;gap:10px}
.top-divider{width:1px;height:20px;background:var(--border2)}
.top-right{display:flex;align-items:center;gap:8px}
.user-pill{font-size:12px;color:var(--text2);font-family:var(--mono);background:var(--bg2);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.role-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em}
.role-admin{background:rgba(240,78,35,0.15);color:#f04e23;border:1px solid rgba(240,78,35,0.3)}
.role-editor{background:rgba(61,79,107,0.3);color:#7a9eca;border:1px solid rgba(61,79,107,0.5)}
.role-lector{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border2)}
.btn-sm{font-family:var(--font);font-size:12px;padding:6px 14px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn-sm:hover{color:var(--orange);border-color:var(--orange)}
.btn-sm:disabled{opacity:.4;cursor:default}
.btn-orange{font-family:var(--font);font-size:12px;font-weight:600;padding:8px 16px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn-orange:hover{background:var(--orange2)}
.btn-orange:disabled{opacity:.4;cursor:default}
.btn-danger{font-family:var(--font);font-size:12px;padding:8px 14px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer}
.btn-danger:hover{color:var(--red);border-color:var(--red)}
.main{padding:20px 24px;max-width:1600px;width:100%;margin:0 auto}
.loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{font-family:var(--font);font-size:13px;font-weight:500;padding:8px 18px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--orange);color:var(--text)}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}

/* barra de filtros / selección */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{font-family:var(--font);font-size:13px;padding:7px 11px;background:var(--bg2);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);outline:none}
.filters select:focus,.filters input:focus{border-color:var(--orange)}
.filters select.sel-marca{font-weight:600;min-width:240px}
.filters label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.spacer{flex:1}
.mesnav{display:inline-flex;align-items:center;gap:4px}
.mesnav .lbl{font-size:15px;font-weight:700;min-width:150px;text-align:center;letter-spacing:-.01em}
.mesnav button{font-family:var(--font);font-size:14px;width:32px;height:32px;background:var(--bg2);color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer}
.mesnav button:hover{color:var(--orange);border-color:var(--orange)}
.mesnav button.hoy{width:auto;padding:0 10px;font-size:11px;font-weight:600}

/* kpis */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--orange);border-radius:var(--radius-lg);padding:13px 16px}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:5px}
.kpi.ok{border-top-color:var(--green)}.kpi.bad{border-top-color:var(--red)}
.kpi.warn{border-top-color:var(--amber)}.kpi.mute{border-top-color:var(--text3)}
.kpi.email{border-top-color:var(--ch-email)}.kpi.push{border-top-color:var(--ch-push)}.kpi.wpp{border-top-color:var(--ch-wpp)}

/* secciones y tablas */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)}
td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(255,255,255,.03)}
tr.crow td{background:var(--bg3);padding:7px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
tr.crow .kam{color:var(--text2);font-weight:500;text-transform:none;letter-spacing:0;margin-left:8px}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.muted{color:var(--text3)}
.strong{font-weight:600}
.wrap-cell{max-width:260px;font-size:12px;color:var(--text2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:20px;white-space:nowrap}
.chip.green{background:rgba(34,197,94,.13);color:#22c55e;border:1px solid rgba(34,197,94,.28)}
.chip.red{background:rgba(239,68,68,.13);color:#ef4444;border:1px solid rgba(239,68,68,.28)}
.chip.amber{background:rgba(245,158,11,.13);color:#f59e0b;border:1px solid rgba(245,158,11,.28)}
.chip.blue{background:rgba(122,158,202,.13);color:#7a9eca;border:1px solid rgba(122,158,202,.28)}
.chip.grey{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border2)}
.chip.orange{background:rgba(240,78,35,.13);color:#f04e23;border:1px solid rgba(240,78,35,.3)}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip .x{cursor:pointer;opacity:.6;margin-left:2px}
.chip .x:hover{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.email{background:var(--ch-email)}.dot.push{background:var(--ch-push)}.dot.wpp{background:var(--ch-wpp)}

/* filtro por canal */
.fchip{font-family:var(--font);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
  background:transparent;color:var(--text3);border:1px solid var(--border2);display:inline-flex;align-items:center;gap:6px}
.fchip:hover{color:var(--text)}
.fchip.on{color:var(--text);border-color:var(--border);background:var(--bg3)}
.fchip:not(.on) .dot{opacity:.3}
.fchip b{font-family:var(--mono);font-size:10px;opacity:.75}

/* barra del mes */
.mesbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:14px}
.seg{display:inline-flex;gap:3px;flex-wrap:wrap}
.seg button{font-family:var(--font);font-size:10.5px;font-weight:700;padding:5px 10px;background:transparent;color:var(--text3);
  border:1px solid var(--border2);border-radius:6px;cursor:pointer;letter-spacing:.02em}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg3);border-color:var(--border);color:var(--text)}
.seg button.on.borrador{background:rgba(255,255,255,.1)}
.seg button.on.revision{background:#f59e0b;border-color:#f59e0b;color:#3b2300}
.seg button.on.aprobado{background:#16a34a;border-color:#16a34a;color:#fff}
.seg button.on.cerrado{background:var(--blue);border-color:var(--blue);color:#0b1929}
.seg button.on.email{background:var(--ch-email);border-color:var(--ch-email);color:#fff}
.seg button.on.push{background:var(--ch-push);border-color:var(--ch-push);color:#0b1929}
.seg button.on.wpp{background:var(--ch-wpp);border-color:var(--ch-wpp);color:#06210f}
.seg button.on.idea{background:rgba(255,255,255,.12)}
.seg button.on.planificado{background:var(--bg3);border-color:var(--text2)}
.seg button.on.enviado{background:#16a34a;border-color:#16a34a;color:#fff}
.seg button.on.cancelado{background:#dc2626;border-color:#dc2626;color:#fff}
.seg button:disabled{cursor:default}
.mesbar .lab{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.acciones{display:flex;gap:6px;flex-wrap:wrap}

/* calendario */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1150px){.cal-layout{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal-scroll{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:740px}
.cal-dow{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;border-bottom:1px solid var(--border)}
.cal-day{min-height:122px;border-right:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);padding:6px;display:flex;flex-direction:column;gap:4px;position:relative}
.cal-day:nth-child(7n){border-right:none}
.cal-day.edit{cursor:pointer}
.cal-day.out{background:rgba(0,0,0,.2)}
.cal-day.out .cal-num{opacity:.35}
.cal-day.we{background:rgba(255,255,255,.018)}
.cal-day.drop{outline:2px dashed var(--orange);outline-offset:-3px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cal-num{font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.cal-day.today .cal-num{background:var(--orange);color:#fff}
.cal-plus{font-size:15px;color:var(--text3);opacity:0;line-height:1;padding:0 3px}
.cal-day.edit:hover .cal-plus{opacity:1}
.cal-key{font-size:9.5px;font-weight:700;background:rgba(245,158,11,.14);color:#f59e0b;border:1px solid rgba(245,158,11,.28);border-radius:4px;padding:2px 5px;line-height:1.25}
.cal-key.marca{background:rgba(240,78,35,.12);color:#ff8a66;border-color:rgba(240,78,35,.3)}
/* tipos de acción: bancaria · comercial · microevento · always on */
.cal-key.cat-bancaria{background:rgba(122,158,202,.14);color:#9dbbe0;border-color:rgba(122,158,202,.38)}
.cal-key.cat-comercial{background:rgba(240,78,35,.12);color:#ff8a66;border-color:rgba(240,78,35,.3)}
.cal-key.cat-microevento{background:rgba(192,132,252,.13);color:#d8b4fe;border-color:rgba(192,132,252,.35)}
.cal-key.cat-always_on{background:rgba(34,197,94,.1);color:#6ee7a0;border-color:rgba(34,197,94,.28)}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.cat-dot.cat-bancaria{background:#7a9eca}.cat-dot.cat-comercial{background:#f04e23}.cat-dot.cat-microevento{background:#c084fc}.cat-dot.cat-always_on{background:#22c55e}
.legend-cat{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text3);margin:8px 2px 0}
/* arrastrar: destinos, bandeja y tira de días de la lista */
[data-drop].drop{outline:2px dashed var(--orange);outline-offset:-3px;background:rgba(240,78,35,.07)}
@keyframes flash{0%{background:rgba(240,78,35,.35);box-shadow:0 0 0 2px var(--orange)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
.ev.flash{animation:flash 1.8s ease-out}
tr.flash td{animation:flash 1.8s ease-out}
.side-card.bandeja{border-left:3px solid var(--orange)}
.bj-list{display:flex;flex-direction:column;gap:5px}
.bj-add{display:flex;gap:6px;margin-top:10px}
.bj-add select,.bj-add input{font-family:var(--font);font-size:12px;padding:7px 9px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;outline:none}
.bj-add input{flex:1;min-width:0}
.bj-add select:focus,.bj-add input:focus{border-color:var(--orange)}
.grip{cursor:grab;color:var(--text3);padding:0 7px 0 0;user-select:none;font-size:12px;letter-spacing:-2px;vertical-align:middle}
.grip:hover{color:var(--orange)}
.ltab td.sel{white-space:nowrap}
.ev{font-size:11px;line-height:1.3;background:var(--bg3);border-left:3px solid var(--text3);border-radius:5px;padding:4px 6px;cursor:pointer;word-break:break-word}
.ev:hover{outline:1px solid rgba(255,255,255,.35)}
.ev.email{border-left-color:var(--ch-email)}.ev.push{border-left-color:var(--ch-push)}.ev.wpp{border-left-color:var(--ch-wpp)}
.ev-h{font-family:var(--mono);font-size:9.5px;color:var(--text2);display:flex;justify-content:space-between;gap:4px}
.ev-t{font-weight:600}
.ev.st-idea{background:transparent;border:1px dashed var(--border2);border-left-width:3px}

<script>
const VERSION_APP = '2026-10-07.9';
const SB_URL  = 'https://ojzcxwhoinmljospgmfp.supabase.co';

var ultimoCanal = null;
var selIds = {};      // envíos tildados en la lista (acciones en lote)
var nuevaFila = null; // fecha/canal que arrastra la fila de alta de la lista
const CABREV = {email:'Email', push:'Push', wpp:'WPP'};
const ROL_LABEL = {admin:'Admin', editor:'Editor', lector:'Lector'};

// ── helpers ────────────────────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg, isErr){
  var t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.className = 'toast'; }, 2800);
}
function ymd(y, m, d){ return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function parseF(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); }
function hoyStr(){ var d = new Date(); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function periodoDe(fecha){ return fecha.slice(0, 7) + '-01'; }
function addMes(periodo, n){
  var d = parseF(periodo); d.setDate(1); d.setMonth(d.getMonth() + n);
  return ymd(d.getFullYear(), d.getMonth() + 1, 1);
}
function diasDelMes(periodo){ var d = parseF(periodo); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function finMes(periodo){ return periodo.slice(0, 8) + String(diasDelMes(periodo)).padStart(2,'0'); }
function periodoLargo(p){ var d = p.split('-'); return MESES[+d[1] - 1] + ' ' + d[0]; }
function periodoCorto(p){ var d = p.split('-'); return MESES[+d[1] - 1].slice(0,3).toLowerCase() + ' ' + d[0].slice(2); }
function fechaCorta(f){ var d = f.split('-'); return d[2] + '/' + d[1]; }
function fechaLarga(f){ var d = f.split('-'); return d[2] + '/' + d[1] + '/' + d[0]; }
function dowDe(f){ return DOW[parseF(f).getDay()]; }
function nombreUsuario(){ return me.nombre || me.email; }
function canalesDe(marcaId){
  var c = D.configById[marcaId];
  return c && c.canales && c.canales.length ? CANALES.filter(function(k){ return c.canales.indexOf(k) >= 0; }) : CANALES.slice();
}
function puedeEditar(marcaId){
  if (!me) return false;
  if (me.rol === 'admin') return true;
  return me.rol === 'editor' && D.misMarcas.indexOf(marcaId) >= 0;
}
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function guardarSel(){ lsSet('cal_sel', {marca: sel.marca, vista: sel.vista}); }

// PostgREST corta en 1000 filas: paginamos
function fetchAll(tabla, cols, filtro){
  var out = [], size = 1000;
  function paso(page){
    var q = sb.from(tabla).select(cols || '*');
    if (filtro) q = filtro(q);
    return q.range(page * size, (page + 1) * size - 1).then(function(r){
      if (r.error) throw r.error;
      var rows = r.data || [];
      out = out.concat(rows);
      return rows.length < size ? out : paso(page + 1);
    });
  }
  return paso(0);
}

// ── auth ───────────────────────────────────────────────────────────────────
$('loginBtn').onclick = function(){
  var e = $('email').value.trim(), p = $('pass').value;
  if (!e || !p) { $('authErr').textContent = 'Completá email y contraseña'; return; }
  $('authErr').textContent = '';
  sb.auth.signInWithPassword({ email: e, password: p }).then(function(r){
    if (r.error) { $('authErr').textContent = r.error.message || 'No se pudo entrar'; return; }
    boot();
  });
};
$('pass').onkeydown = function(ev){ if (ev.key === 'Enter') $('loginBtn').click(); };
$('logoutBtn').onclick = function(){ sb.auth.signOut().then(function(){ location.reload(); }); };
sb.auth.getSession().then(function(r){ if (r.data.session) boot(); });

function boot(){
  sb.rpc('cal_vincular').then(function(r){
    var row = (r.data || [])[0];
    if (r.error){
      // si la función no existe es que falta correr el schema
      var falta = /cal_vincular|function|schema cache/i.test(r.error.message || '');
      $('authErr').textContent = falta
        ? 'Falta correr calendario-schema.sql en el SQL editor de Supabase'
        : (r.error.message || 'Error al validar el usuario');
      sb.auth.signOut();
      return;
    }
    if (!row){
      $('authErr').textContent = 'Tu usuario no está habilitado en el calendario. Pedile acceso a Tomás.';
      sb.auth.signOut();
      return;
    }
    me = row;
    $('authScreen').style.display = 'none';
    $('app').classList.add('visible');
    $('userPill').textContent = nombreUsuario();
    $('roleBadge').textContent = ROL_LABEL[me.rol] || me.rol;
    $('roleBadge').className = 'role-badge role-' + me.rol;
    $('version').textContent = 'versión ' + VERSION_APP;
    cargar();
  });
}

// ── datos ──────────────────────────────────────────────────────────────────
function cargar(){
  Promise.all([
    fetchAll('sem_marcas', '*', function(q){ return q.order('nombre'); }),
    fetchAll('sem_celulas', '*', function(q){ return q.order('nombre'); }),
    fetchAll('cal_usuarios', '*', function(q){ return q.order('nombre'); }),
    fetchAll('cal_usuario_marcas', '*'),
    fetchAll('cal_marca_config', '*'),
    fetchAll('cal_fechas', '*', function(q){ return q.order('fecha'); })
  ]).then(function(res){
    D.marcas   = res[0];
    D.celulas  = res[1];
    D.usuarios = res[2];
    D.um       = res[3];
    D.config   = res[4];
    D.fechas   = res[5];
    indexar();
    var guardada = lsGet('cal_sel') || {};
    var hoy = periodoDe(hoyStr());
    // el calendario que se arma suele ser el del mes que viene; arranca ahí
    sel.periodo = addMes(hoy, 1);
    sel.vista   = guardada.vista === 'lista' ? 'lista' : 'cal';
    var vis = marcasVisibles().map(function(m){ return m.id; });
    var pref = me.rol === 'admin' && D.misMarcas.length ? D.misMarcas : vis;
    sel.marca = vis.indexOf(guardada.marca) >= 0 ? guardada.marca : (pref[0] || null);
    render();
  }).catch(function(e){

function indexar(){

  D.marcaById  = {}; D.marcas.forEach(function(m){ D.marcaById[m.id] = m; });
  D.celulaById = {}; D.celulas.forEach(function(c){ D.celulaById[c.id] = c; });

// todos los envíos y meses de una marca (son pocos: ~30 por mes)
function cargarMarca(marcaId){
  if (D.cargando[marcaId]) return D.cargando[marcaId];
  D.cargando[marcaId] = Promise.all([
    fetchAll('cal_envios', '*', function(q){ return q.eq('marca_id', marcaId).order('fecha').order('hora'); }),
    fetchAll('cal_meses', '*', function(q){ return q.eq('marca_id', marcaId); })
  ]).then(function(res){
    D.env[marcaId] = res[0];
    D.meses[marcaId] = res[1];
  }).catch(function(e){
    delete D.cargando[marcaId];
    toast('No se pudieron traer los envíos: ' + (e.message || e), true);
  });
  return D.cargando[marcaId];
}
function ordenEnv(a, b){
  return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : String(a.hora || '99').localeCompare(String(b.hora || '99'));
}
function envDeMes(marcaId, periodo){
  return (D.env[marcaId] || []).filter(function(e){ return !e.bandeja && periodoDe(e.fecha) === periodo; }).sort(ordenEnv);
}
function mesReg(marcaId, periodo){
  return (D.meses[marcaId] || []).find(function(r){ return r.periodo === periodo; }) || null;
}
function contar(envs){
  var c = {email:0, push:0, wpp:0, total:0, enviados:0, cancelados:0, ideas:0};
  envs.forEach(function(e){
    if (e.estado === 'cancelado') { c.cancelados++; return; }
    c[e.canal]++; c.total++;
    if (e.estado === 'enviado') c.enviados++;
    if (e.estado === 'idea') c.ideas++;
  });
  return c;
}
// fechas clave que caen en el mes (generales + de la marca; las anuales se proyectan)
function fechasDelMes(marcaId, periodo){
  var y = +periodo.slice(0, 4), ini = periodo, fin = finMes(periodo), out = [];
  D.fechas.forEach(function(f){
    if (f.marca_id && f.marca_id !== marcaId) return;
    var desde = f.fecha, hasta = f.hasta || f.fecha;
    if (f.anual){
      var off = parseF(hasta) - parseF(desde);
      desde = y + desde.slice(4);
      var h = new Date(parseF(desde).getTime() + off);
      hasta = ymd(h.getFullYear(), h.getMonth() + 1, h.getDate());
    }
    if (hasta < ini || desde > fin) return;
    out.push({id: f.id, nombre: f.nombre, desde: desde, hasta: hasta, marca: !!f.marca_id, notas: f.notas, cat: f.categoria || null});
  });
  return out;
}

function gridMes(m, p, envs, ed){
  var primero = parseF(p), dim = diasDelMes(p);
  var lead = (primero.getDay() + 6) % 7;          // semana arranca el lunes
  var total = Math.ceil((lead + dim) / 7) * 7;
  var hoy = hoyStr();
  var keys = fechasDelMes(m, p);
  var porDia = {};
  envs.forEach(function(e){ (porDia[e.fecha] = porDia[e.fecha] || []).push(e); });

  var h = '<div class="cal"><div class="cal-scroll"><div class="cal-grid">' +
    ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
  for (var i = 0; i < total; i++){
    var dia = i - lead + 1;
    if (dia < 1 || dia > dim){ h += '<div class="cal-day out"></div>'; continue; }
    var f = ymd(primero.getFullYear(), primero.getMonth() + 1, dia);
    var we = (i % 7) >= 5;
    h += '<div class="cal-day' + (we ? ' we' : '') + (f === hoy ? ' today' : '') + (ed ? ' edit' : '') + '" data-f="' + f + '"' + (ed ? ' data-drop="' + f + '"' : '') +
      (ed ? ' onclick="clickDia(event,\'' + f + '\')"' : '') + '>' +
      '<div class="cal-top"><span class="cal-num">' + dia + '</span>' + (ed ? '<span class="cal-plus" title="Envío con todos los campos">+</span>' : '') + '</div>';
    keys.forEach(function(k){
      if (f >= k.desde && f <= k.hasta) h += '<div class="cal-key' + (k.marca ? ' marca' : '') + (k.cat ? ' cat-' + k.cat : '') + '" title="' + esc(k.notas || '') + '">★ ' + esc(k.nombre) + '</div>';
    });
    (porDia[f] || []).forEach(function(e){ h += chipEnvio(e, ed); });
    if (quick && quick.fecha === f) h += cajaRapida(m);
    h += '</div>';
  }
  h += '</div></div></div>';
  var catsMes = CATS.filter(function(c){ return keys.some(function(k){ return k.cat === c; }); });
  if (catsMes.length) h += '<div class="legend-cat">' + catsMes.map(function(c){ return '<span><i class="cat-dot cat-' + c + '"></i>' + CATPL[c] + '</span>'; }).join('') + '</div>';
  if (ed) h += '<div class="hint"><b>Carga rápida:</b> tocá un día, escribí el tema y Enter (podés seguir cargando en el mismo día). ' +
    '<b>Tab</b> cambia el canal, o escribí <code>w: tema</code> / <code>p: tema</code> / <code>e: tema</code> y <code>10:30 tema</code> para la hora. ' +
    'El <b>+</b> abre el formulario completo. Arrastrá un envío para moverlo de día.</div>';
  return h;
}

    }).join('') + '</div>' +

function qaKey(ev){

// Un solo manejador para todo: lo que se agarra lleva data-drag (id del envío) y
// donde se suelta lleva data-drop (una fecha YYYY-MM-DD o "bandeja").
function engancharDrag(){}   // compatibilidad: los listeners son globales

// (en la Lista la fila salta a su nueva fecha y, si no, parece que desapareció)
function resaltar(id){
  var el = document.querySelector('.ltab tr[data-id="' + id + '"]') ||
           document.querySelector('.cal-grid .ev[data-id="' + id + '"]') ||
           document.querySelector('.bandeja .ev[data-id="' + id + '"]');
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');

function limpiarDrop(){ Array.prototype.forEach.call(document.querySelectorAll('.drop'), function(x){ x.classList.remove('drop'); }); }
document.addEventListener('dragstart', function(ev){
  var el = ev.target.closest && ev.target.closest('[data-drag]');
  if (!el) return;
  arrastrando = +el.dataset.drag;
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', el.dataset.drag); } catch(e){}
});
document.addEventListener('dragend', function(){ arrastrando = null; limpiarDrop(); });
document.addEventListener('dragover', function(ev){
  if (!arrastrando) return;
  var t = ev.target.closest && ev.target.closest('[data-drop]');
  if (!t) return;
  ev.preventDefault();
  if (!t.classList.contains('drop')){ limpiarDrop(); t.classList.add('drop'); }
});
document.addEventListener('drop', function(ev){
  var t = ev.target.closest && ev.target.closest('[data-drop]');
  if (!t || !arrastrando) return;
  ev.preventDefault();
  var id = arrastrando;
  arrastrando = null; limpiarDrop();
  moverEnvio(id, t.dataset.drop);
});
function moverEnvio(id, destino){
  var e = buscarEnvio(id);
  if (!e || !puedeEditar(e.marca_id)) return;
  var o = {actualizado_at: new Date().toISOString()};
  if (destino === 'bandeja'){
    if (e.bandeja) return;
    o.bandeja = true;
    // queda en la bandeja del mes que se está mirando
    if (periodoDe(e.fecha) !== sel.periodo) o.fecha = sel.periodo;
  } else {
    if (e.fecha === destino && !e.bandeja) return;
    o.fecha = destino;
    if (e.bandeja) o.bandeja = false;
  }
  sb.from('cal_envios').update(o).eq('id', id).select().single().then(function(r){
    if (r.error) return toast(errBandeja(r.error), true);
    reemplazarLocal(r.data); render(); resaltar(id);
    toast(destino === 'bandeja' ? 'A la bandeja (sin día)' : 'Movido al ' + dowDe(r.data.fecha) + ' ' + fechaCorta(r.data.fecha));
  });
}

function listaMes(envs, ed){
  if (!ed) return listaLectura(envs, ed);
  var m = sel.marca, cs = canalesDe(m), usados = D.env[m] || [];
  var tipos = TIPOS.concat(usados.map(function(e){ return e.tipo; })).filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  var segs = usados.map(function(e){ return e.segmento; }).filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  var nSel = envs.filter(function(e){ return selIds[e.id]; }).length;
  if (!nuevaFila){
    var ult = envs.length ? envs[envs.length - 1].fecha : (periodoDe(hoyStr()) === sel.periodo ? hoyStr() : sel.periodo);
    nuevaFila = {fecha: ult, canal: cs.indexOf(ultimoCanal) >= 0 ? ultimoCanal : cs[0]};
  }
  var h = '<div class="section">';
  if (nSel) h += barraLote(nSel, cs);
  h += '<div class="twrap"><table class="ltab"><thead><tr>' +
    '<th class="sel"><input type="checkbox" title="Seleccionar todos"' + (nSel && nSel === envs.length ? ' checked' : '') + (envs.length ? '' : ' disabled') + ' onchange="selTodos(this.checked)"></th>' +
    '<th>Fecha</th><th>Hora</th><th>Canal</th><th>Tipo</th><th>Tema</th><th>Asunto / copy</th><th>Segmento</th><th>Estado</th></tr></thead><tbody>';
  if (!envs.length) h += '<tr><td colspan="9"><div class="empty" style="padding:26px 10px">No hay envíos cargados para este mes. Escribí el primero acá abajo, o usá <b>Pegar desde planilla</b> / <b>Copiar de otro mes</b>.</div></td></tr>';
  envs.forEach(function(e){
    var id = e.id, ce = function(campo, cls, html){
      return '<td class="ed ' + cls + '" onclick="editarCelda(this,' + id + ',\'' + campo + '\')">' + html + '</td>';
    };
    var csE = cs.indexOf(e.canal) >= 0 ? cs : cs.concat([e.canal]);
    h += '<tr class="' + (selIds[id] ? 'chk-on' : '') + '" data-id="' + id + '" data-drop="' + e.fecha + '">' +
      '<td class="sel"><span class="grip" draggable="true" data-drag="' + id + '" title="Arrastrá para cambiar el día">⋮⋮</span><input type="checkbox"' + (selIds[id] ? ' checked' : '') + ' onchange="toggleSel(' + id + ',this.checked)"></td>' +
      ce('fecha', 'lst-fecha', dowDe(e.fecha) + ' ' + fechaCorta(e.fecha)) +
      ce('hora', 'lst-fecha muted', esc(e.hora || '')) +
      '<td><select class="chip-sel c-' + e.canal + '" onchange="editCampo(' + id + ',\'canal\',this.value)">' + opciones(csE, e.canal, CLABEL) + '</select></td>' +
      ce('tipo', 'muted', esc(e.tipo || '')) +
      ce('titulo', 'strong', esc(e.titulo)) +
      ce('asunto', '', '<div class="wrap-cell">' + esc(e.asunto || '') + '</div>') +
      ce('segmento', 'muted', esc(e.segmento || '')) +
      '<td style="white-space:nowrap"><select class="chip-sel s-' + e.estado + '" onchange="editCampo(' + id + ',\'estado\',this.value)">' + opciones(EST_ENV, e.estado, ELABEL) + '</select>' +
      ' <button class="mini" title="Abrir el envío completo" onclick="abrirEnvio(' + id + ')">⋯</button></td></tr>';
  });
  h += '<tr class="addtr"><td class="sel muted">+</td><td colspan="8"><div class="addline" onkeydown="if(event.key===\'Enter\'){event.preventDefault();agregarFila()}">' +
    '<input type="date" id="nFecha" value="' + nuevaFila.fecha + '">' +
    '<select id="nCanal">' + opciones(cs, nuevaFila.canal, CLABEL) + '</select>' +
    '<input class="tema" id="nTitulo" data-k="n-titulo" placeholder="Nuevo envío: escribí el tema y Enter" autocomplete="off">' +
    '<button class="btn-sm" onclick="agregarFila()">Agregar</button></div></td></tr>';
  h += '</tbody></table></div>' +
    '<datalist id="lTiposL">' + tipos.map(function(t){ return '<option value="' + esc(t) + '">'; }).join('') + '</datalist>' +
    '<datalist id="lSegsL">' + segs.map(function(t){ return '<option value="' + esc(t) + '">'; }).join('') + '</datalist></div>' +
    '<div class="hint" style="margin-top:-8px">Tocá cualquier celda para editarla (Enter guarda, Esc cancela). Canal y estado se cambian desde su chip. ' +
    'Tildá varios para cambiarlos juntos.</div>';
  return h;
}
function editarCelda(td, id, campo){
  if (td.querySelector('input')) return;
  var e = buscarEnvio(id);
  if (!e) return;
  var val = e[campo] || '';
  var type = campo === 'fecha' ? 'date' : campo === 'hora' ? 'time' : 'text';
  var list = campo === 'tipo' ? ' list="lTiposL"' : campo === 'segmento' ? ' list="lSegsL"' : '';
  td.innerHTML = '<input class="cell-in" type="' + type + '"' + list + ' value="' + esc(val) + '">';
  var inp = td.firstChild, hecho = false;
  inp.focus();
  if (type === 'text') inp.select();
  inp.onkeydown = function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); }
    else if (ev.key === 'Escape'){ ev.preventDefault(); ev.stopPropagation(); hecho = true; render(); }
  };
  inp.onblur = function(){
    if (hecho) return;
    hecho = true;
    if (inp.value.trim() === String(val)) { render(); return; }
    editCampo(id, campo, inp.value);
  };
}
function agregarFila(){
  var row = {marca_id: sel.marca, fecha: $('nFecha').value, canal: $('nCanal').value,
    titulo: $('nTitulo').value.trim(), estado: 'planificado', creado_por: nombreUsuario()};
  if (!row.fecha) return toast('Falta la fecha', true);
  if (!row.titulo){ $('nTitulo').focus(); return toast('Falta el tema', true); }
  sb.from('cal_envios').insert(row).select().single().then(function(r){
    if (r.error) return toast(r.error.message, true);
    reemplazarLocal(r.data);
    nuevaFila = {fecha: row.fecha, canal: row.canal};
    ultimoCanal = row.canal;
    render();
    var t = $('nTitulo'); if (t) t.focus();
    if (periodoDe(row.fecha) !== sel.periodo) toast('Guardado en ' + periodoLargo(periodoDe(row.fecha)));
  });
}
function editCampo(id, campo, val){
  var e = buscarEnvio(id);
  if (!e) return;
  val = String(val || '').trim();
  if ((e[campo] || '') === val){ render(); return; }
  if (campo === 'titulo' && !val){ toast('El tema no puede quedar vacío', true); render(); return; }
  if (campo === 'fecha' && !val){ render(); return; }
  var o = {actualizado_at: new Date().toISOString()};
  o[campo] = val || null;
  sb.from('cal_envios').update(o).eq('id', id).select().single().then(function(r){
    if (r.error){ toast(r.error.message, true); render(); return; }
    reemplazarLocal(r.data);
    render();
    if (campo === 'fecha') resaltar(id);
    if (campo === 'fecha' && periodoDe(val) !== sel.periodo) toast('Movido a ' + periodoLargo(periodoDe(val)));
  });
}

// ── acciones en lote ───────────────────────────────────────────────────────
function idsSel(){ return envsExport().filter(function(e){ return selIds[e.id]; }).map(function(e){ return e.id; }); }
function toggleSel(id, on){ selIds[id] = on; render(); }
function selTodos(on){ selIds = {}; if (on) envsExport().forEach(function(e){ selIds[e.id] = true; }); render(); }
function barraLote(n, cs){
  return '<div class="batch"><b>' + n + ' seleccionado(s)</b>' +
    '<select onchange="if(this.value)lote({estado:this.value})"><option value="">Cambiar estado…</option>' + opciones(EST_ENV, null, ELABEL) + '</select>' +
    '<select onchange="if(this.value)lote({canal:this.value})"><option value="">Cambiar canal…</option>' + opciones(cs, null, CLABEL) + '</select>' +
    '<span class="muted">Mover al</span><input type="date" onchange="if(this.value)lote({fecha:this.value})">' +
    '<span class="spacer"></span><button class="btn-danger" onclick="borrarLote()">Eliminar</button>' +
    '<button class="btn-sm" onclick="selIds={};render()">Deseleccionar</button></div>';
}
function lote(campos){
  var ids = idsSel();
  if (!ids.length) return;
  sb.from('cal_envios').update(Object.assign({actualizado_at: new Date().toISOString()}, campos)).in('id', ids).select().then(function(r){
    if (r.error) return toast(r.error.message, true);
    r.data.forEach(reemplazarLocal);
    if (campos.fecha) selIds = {};
    render();
    toast(r.data.length + ' envío(s) actualizados' + (campos.fecha && periodoDe(campos.fecha) !== sel.periodo ? ' (pasaron a ' + periodoLargo(periodoDe(campos.fecha)) + ')' : ''));
  });
}
function borrarLote(){
  var ids = idsSel();
  if (!ids.length || !confirm('¿Eliminar ' + ids.length + ' envío(s)?\nSi se cancelaron, mejor marcalos como Cancelado así quedan en el historial.')) return;
  sb.from('cal_envios').delete().in('id', ids).then(function(r){
    if (r.error) return toast(r.error.message, true);
    D.env[sel.marca] = D.env[sel.marca].filter(function(x){ return ids.indexOf(x.id) < 0; });
    selIds = {}; invalidarResumen(); render(); toast(ids.length + ' envío(s) eliminados');
  });
}

function listaLectura(envs, ed){
  if (!envs.length) return '<div class="section"><div class="empty">No hay envíos cargados para este mes' +
    (ed ? '.<br>Usá <b>+ Envío</b> o <b>Copiar de otro mes</b> para arrancar.' : '.') + '</div></div>';
  return '<div class="section"><div class="twrap"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Canal</th><th>Tipo</th><th>Tema</th><th>Asunto / copy</th><th>Segmento</th><th>Estado</th></tr></thead><tbody>' +
    envs.map(function(e){
      return '<tr class="clickable" onclick="abrirEnvio(' + e.id + ')"><td class="lst-fecha">' + dowDe(e.fecha) + ' ' + fechaCorta(e.fecha) + '</td>' +
        '<td class="lst-fecha muted">' + esc(e.hora || '') + '</td>' +
        '<td><span class="chip grey"><i class="dot ' + e.canal + '"></i>' + CLABEL[e.canal] + '</span></td>' +
        '<td class="muted">' + esc(e.tipo || '') + '</td><td class="strong">' + esc(e.titulo) + '</td>' +
        '<td><div class="wrap-cell">' + esc(e.asunto || '') + '</div></td><td class="muted">' + esc(e.segmento || '') + '</td>' +
        '<td>' + chipEstado(e.estado) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
}
function chipEstado(s){
  var cls = {idea:'grey', planificado:'blue', aprobado:'amber', enviado:'green', cancelado:'red'}[s];
  return '<span class="chip ' + cls + '">' + ELABEL[s] + '</span>';
}

// ── panel lateral: lo que pasó antes + memoria del mes ─────────────────────
function panelLateral(m, p, reg, ed, canales){
  var prev = addMes(p, -1), anio = addMes(p, -12);
  var ePrev = envDeMes(m, prev), rPrev = mesReg(m, prev) || {};
  var cP = contar(ePrev);
  var h = tarjetaBandeja(m, p, ed);

  // este mes
  h += '<div class="side-card"><div class="side-title">Foco de ' + MESES[+p.slice(5,7) - 1].toLowerCase() + '</div>' +
    campoMes('foco', reg.foco, ed, 'Objetivo comercial, campañas fuertes, qué pidió el cliente…') + '</div>';

  // mes anterior
  h += '<div class="side-card prev"><div class="side-title">Mes anterior · ' + periodoLargo(prev) +
    '<a onclick="irA(' + m + ',\'' + prev + '\')">ver</a></div>';
  if (!ePrev.length && !rPrev.id){
    h += '<div class="side-txt vacio">Sin datos cargados.</div>';
  } else {
    h += '<div class="cnt-row">' + CANALES.map(function(k){
      return '<div class="cnt ' + k + '"><b>' + cP[k] + '</b><span>' + CLABEL[k] + '</span></div>';
    }).join('') + '</div>' +
    '<div class="side-lab">Resultado del armado</div><div class="side-txt">' + cP.enviados + ' enviados · ' + cP.cancelados + ' cancelados' +
      (rPrev.estado ? ' · ' + MLABEL[rPrev.estado] : '') + '</div>' +
    textoMes('Foco', rPrev.foco) + textoMes('Qué funcionó', rPrev.funciono) +
    textoMes('Qué no funcionó', rPrev.no_funciono) + textoMes('Para repetir / probar', rPrev.repetir);
    if (ed && ePrev.length) h += '<div style="margin-top:12px"><button class="btn-sm" onclick="abrirCopia(\'' + prev + '\')">Copiar sus envíos a este mes</button></div>';
  }
  h += '</div>';

  // mismo mes del año pasado (estacionalidad)
  var eAnio = envDeMes(m, anio);
  if (eAnio.length){
    var cA = contar(eAnio), rA = mesReg(m, anio) || {};
    h += '<div class="side-card prev"><div class="side-title">Hace un año · ' + periodoLargo(anio) +
      '<a onclick="irA(' + m + ',\'' + anio + '\')">ver</a></div>' +
      '<div class="side-txt">' + cA.total + ' envíos (' + CANALES.map(function(k){ return cA[k] + ' ' + CLABEL[k].toLowerCase(); }).join(', ') + ')</div>' +
      textoMes('Qué funcionó', rA.funciono) + textoMes('Para repetir', rA.repetir) +
      (ed ? '<div style="margin-top:12px"><button class="btn-sm" onclick="abrirCopia(\'' + anio + '\')">Copiar sus envíos a este mes</button></div>' : '') +
      '</div>';
  }

  // aprendizajes de este mes
  h += '<div class="side-card"><div class="side-title">Aprendizajes de este mes</div>' +
    '<div class="side-lab">Qué funcionó</div>' + campoMes('funciono', reg.funciono, ed, '') +
    '<div class="side-lab">Qué no funcionó</div>' + campoMes('no_funciono', reg.no_funciono, ed, '') +
    '<div class="side-lab">Para repetir / probar el mes que viene</div>' + campoMes('repetir', reg.repetir, ed, '') + '</div>';

  // reglas de la marca
  var cfg = D.configById[m] || {};
  h += '<div class="side-card rules"><div class="side-title">Reglas de la marca</div>';
  if (ed){
    h += '<div style="margin-bottom:8px">' + CANALES.map(function(k){
      return '<label class="chk"><input type="checkbox"' + (canales.indexOf(k) >= 0 ? ' checked' : '') +
        ' onchange="toggleCanalMarca(\'' + k + '\', this.checked)"> ' + CLABEL[k] + '</label>';
    }).join('') + '</div>' +
    '<textarea placeholder="Días que no se envía, frecuencia pactada, quién aprueba, tono, exclusiones…" onchange="guardarReglas(this.value)">' + esc(cfg.reglas || '') + '</textarea>';
  } else {
    h += '<div class="side-txt">Canales: ' + canales.map(function(k){ return CLABEL[k]; }).join(', ') + '</div>' +
      '<div class="side-txt' + (cfg.reglas ? '' : ' vacio') + '" style="margin-top:6px">' + esc(cfg.reglas || 'Sin reglas cargadas.') + '</div>';
  }
  return h + '</div>';
}
function campoMes(campo, val, ed, ph){
  if (!ed) return '<div class="side-txt' + (val ? '' : ' vacio') + '">' + esc(val || '—') + '</div>';
  return '<textarea placeholder="' + esc(ph) + '" onchange="guardarMes(\'' + campo + '\', this.value)">' + esc(val || '') + '</textarea>';
}
function textoMes(lab, val){
  if (!val) return '';
  return '<div class="side-lab">' + lab + '</div><div class="side-txt">' + esc(val) + '</div>';
}

function upsertMes(campos){
  var m = sel.marca, p = sel.periodo;
  var row = Object.assign({marca_id: m, periodo: p, actualizado_por: nombreUsuario(), actualizado_at: new Date().toISOString()}, campos);
  return sb.from('cal_meses').upsert(row, {onConflict: 'marca_id,periodo'}).select().single().then(function(r){
    if (r.error) { toast(r.error.message, true); return null; }
    var lista = D.meses[m] = D.meses[m] || [];
    var i = lista.findIndex(function(x){ return x.periodo === p; });
    if (i >= 0) lista[i] = r.data; else lista.push(r.data);
    invalidarResumen();
    return r.data;
  });
}
function guardarMes(campo, val){
  var o = {}; o[campo] = val.trim() || null;
  upsertMes(o).then(function(d){ if (d) toast('Guardado'); });
}
function setEstadoMes(s){ upsertMes({estado: s}).then(function(d){ if (d) render(); }); }

function guardarConfig(campos){
  var m = sel.marca;
  var row = Object.assign({marca_id: m, canales: canalesDe(m), actualizado_at: new Date().toISOString()}, campos);
  sb.from('cal_marca_config').upsert(row, {onConflict: 'marca_id'}).select().single().then(function(r){
    if (r.error) return toast(r.error.message, true);
    D.configById[m] = r.data;
    var i = D.config.findIndex(function(x){ return x.marca_id === m; });
    if (i >= 0) D.config[i] = r.data; else D.config.push(r.data);
    toast('Guardado'); render();
  });
}
function toggleCanalMarca(k, on){
  var c = canalesDe(sel.marca).filter(function(x){ return x !== k; });
  if (on) c.push(k);
  if (!c.length) { toast('La marca tiene que tener al menos un canal', true); render(); return; }
  guardarConfig({canales: CANALES.filter(function(x){ return c.indexOf(x) >= 0; })});
}
function guardarReglas(v){ guardarConfig({reglas: v.trim() || null}); }

// ── drawer genérico ────────────────────────────────────────────────────────
function abrirDrawer(titulo, meta, body, foot){
  $('dName').textContent = titulo; $('dMeta').textContent = meta || '';
  $('dBody').innerHTML = body; $('dFoot').innerHTML = foot || '';
  $('dFoot').style.display = foot ? 'flex' : 'none';
  $('drawer').classList.add('open'); $('drawerBg').classList.add('open');
}
function cerrarDrawer(){ $('drawer').classList.remove('open'); $('drawerBg').classList.remove('open'); frm = null; }
$('dClose').onclick = cerrarDrawer;
$('drawerBg').onclick = cerrarDrawer;
document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Escape') return;
  if ($('mBg').classList.contains('open')) cerrarModal();
  else if ($('drawer').classList.contains('open')) cerrarDrawer();
});

// ── envío: alta / edición ──────────────────────────────────────────────────
function buscarEnvio(id){
  var out = null;
  Object.keys(D.env).forEach(function(k){ D.env[k].forEach(function(e){ if (e.id === id) out = e; }); });
  return out;
}
function reemplazarLocal(row){
  var lista = D.env[row.marca_id] = D.env[row.marca_id] || [];
  var i = lista.findIndex(function(x){ return x.id === row.id; });
  if (i >= 0) lista[i] = row; else lista.push(row);
  invalidarResumen();
}
function abrirEnvio(id, fecha){
  var m = sel.marca;
  var e = id ? buscarEnvio(id) : null;
  var hoy = hoyStr();
  var def = periodoDe(hoy) === sel.periodo ? hoy : sel.periodo;
  var cs = canalesDe(m);
  frm = e ? Object.assign({}, e) : {id: null, marca_id: m, fecha: fecha || def, hora: '',
    canal: cs.indexOf(ultimoCanal) >= 0 ? ultimoCanal : cs[0],
    tipo: '', titulo: '', asunto: '', segmento: '', notas: '', estado: 'planificado'};
  // los detalles arrancan abiertos solo si el envío ya tiene alguno cargado
  frm.mas = !!(e && (e.tipo || e.segmento || e.notas));
  frm.dup = false;
  dibujarEnvio(true);
}
// tarjeta liviana: canal, tema, fecha/hora y asunto a la vista; el resto plegado
function dibujarEnvio(enfocar){
  var f = frm, ed = puedeEditar(f.marca_id), dis = ed ? '' : ' disabled';
  var usados = D.env[f.marca_id] || [];
  var tipos = TIPOS.concat(usados.map(function(e){ return e.tipo; })).filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  var segs = usados.map(function(e){ return e.segmento; }).filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  var canalesM = canalesDe(f.marca_id);
  if (canalesM.indexOf(f.canal) < 0) canalesM = canalesM.concat([f.canal]);
  var marca = D.marcaById[f.marca_id];
  var titulo = f.dup ? 'Duplicar envío' : f.id ? 'Editar envío' : 'Nuevo envío';

  var segEstado = '<span class="seg">' + EST_ENV.map(function(s){
    return '<button class="' + s + (f.estado === s ? ' on' : '') + '"' + dis + ' onclick="leerEnvio();frm.estado=\'' + s + '\';dibujarEnvio()">' + ELABEL[s] + '</button>';
  }).join('') + '</span>';

  var h = '<div class="m-top"><span class="m-marca">' + esc(titulo) + ' · ' + esc(marca ? marca.nombre : '') + '</span>' +
    '<button class="m-x" onclick="cerrarModal()" title="Cerrar (Esc)">&times;</button></div>' +
    '<div class="m-body"><span class="seg pills">' + canalesM.map(function(k){
      return '<button class="' + k + (f.canal === k ? ' on' : '') + '"' + dis + ' onclick="leerEnvio();frm.canal=\'' + k + '\';ultimoCanal=\'' + k + '\';dibujarEnvio()">' + CLABEL[k] + '</button>';
    }).join('') + '</span>' +
    '<input class="m-tema" id="fTitulo" value="' + esc(f.titulo) + '" placeholder="¿Qué se envía? Ej: Promo Día de la Madre" autocomplete="off"' + dis +
    ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();guardarEnvio()}">' +
    '<div class="m-row"><label class="m-pill">Fecha<input type="date" id="fFecha" value="' + esc(f.fecha) + '"' + dis + '></label>' +
    '<label class="m-pill">Hora<input type="time" id="fHora" value="' + esc(f.hora || '') + '"' + dis + '></label></div>' +
    '<textarea class="m-area" id="fAsunto" rows="2" placeholder="' + (f.canal === 'email' ? 'Asunto / preheader' : 'Copy del mensaje') + ' (opcional)"' + dis +
    ' onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey)){event.preventDefault();guardarEnvio()}">' + esc(f.asunto || '') + '</textarea>' +
    (f.id ? '<div class="m-lab">Estado</div>' + segEstado : '') +
    '<button class="m-more" onclick="leerEnvio();frm.mas=!frm.mas;dibujarEnvio()">' + (f.mas ? '− Ocultar detalles' : '+ Tipo, segmento' + (f.id ? '' : ', estado') + ' y notas') + '</button>';
  if (f.mas){
    h += '<div class="m-grid" style="margin-top:10px">' +

// ── copiar envíos de otro mes ──────────────────────────────────────────────
// "mismo día de la semana": el 2do martes cae en el 2do martes del mes destino
function fechaEquivalente(fecha, destino, modo){
  var d = parseF(fecha), t = parseF(destino), dim = diasDelMes(destino), dia;
  if (modo === 'numero'){
    dia = Math.min(d.getDate(), dim);
  } else {
    var n = Math.floor((d.getDate() - 1) / 7);
    var off = (d.getDay() - t.getDay() + 7) % 7;
    dia = 1 + off + 7 * n;
    while (dia > dim) dia -= 7;
  }
  return ymd(t.getFullYear(), t.getMonth() + 1, dia);
}

// ── pegar filas desde Sheets / Excel ───────────────────────────────────────
function normTxt(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function parseCanal(s){
  var n = normTxt(s);
  if (!n) return null;
  if (/^(w|wa|wsp|wpp|whats|zap)/.test(n)) return 'wpp';
  if (/^(p|push|notif)/.test(n)) return 'push';
  if (/^(e|mail|correo|news|mkt)/.test(n)) return 'email';
  return 'x';
}
function parseEstado(s){
  var n = normTxt(s);
  if (!n) return 'planificado';
  var k = EST_ENV.find(function(x){ return n.indexOf(x.slice(0, 4)) === 0; });
  return k || 'planificado';
}
function parseHora(s){
  var m = String(s || '').trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m && +m[1] < 24 ? m[1].padStart(2, '0') + ':' + m[2] : null;
}
function parseFechaTxt(s, periodo){
  var t = normTxt(s).replace(/^[a-z]+\.?\s+/, ''), y = +periodo.slice(0, 4), mo = +periodo.slice(5, 7), d, m;
  if (!t) return null;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){ y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/))){
    d = +m[1]; mo = +m[2];
    if (m[3]) y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  }
  else if ((m = t.match(/^(\d{1,2})$/))) d = +m[1];
  else return null;
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return ymd(y, mo, d);

// separa celdas respetando comillas (Sheets las usa cuando una celda tiene saltos de línea)
function parseTabla(txt){
  var primera = txt.split(/\r?\n/)[0] || '';
  var sep = primera.indexOf('\t') >= 0 ? '\t' : primera.indexOf(';') >= 0 ? ';' : ',';
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < txt.length; i++){
    var c = txt[i];
    if (q){
      if (c === '"'){ if (txt[i + 1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
      continue;
    }
    if (c === '"' && cur === ''){ q = true; continue; }
    if (c === sep){ row.push(cur); cur = ''; continue; }
    if (c === '\n' || c === '\r'){
      if (c === '\r' && txt[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
      continue;
    }
    cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return x.trim(); }); });
}
const COLS_PEGAR = {fecha:['fecha','date'], dia:['dia'], hora:['hora','horario'], canal:['canal','medio','channel'],
  tipo:['tipo','categoria'], titulo:['tema','titulo','campana','nombre','envio'], asunto:['asunto','copy','subject','mensaje','texto'],
  segmento:['segmento','audiencia','publico','base'], estado:['estado','status'], notas:['notas','nota','comentarios','observaciones','obs']};
function mapaCabecera(row){
  // una fila con una fecha válida es un dato, no títulos
  if (row.some(function(c){ return parseFechaTxt(c, '2000-01-01'); })) return null;
  var map = {}, hits = 0;
  row.forEach(function(c, i){
    var full = normTxt(c);
    if (full.length > 25) return;
    var n = full.split(/[\s\/]+/)[0];
    Object.keys(COLS_PEGAR).forEach(function(k){
      if (map[k] == null && COLS_PEGAR[k].indexOf(n) >= 0){ map[k] = i; hits++; }
    });
  });
  if (map.fecha == null && map.dia != null) map.fecha = map.dia;
  return hits >= 2 ? map : null;
}
function parsePegado(txt, periodo, marcaId){
  var rows = parseTabla(txt || '');

  var map = mapaCabecera(rows[0]);

  var defCanal = canalesDe(marcaId)[0];
  return rows.map(function(r){
    var g = function(k){ return map[k] != null ? String(r[map[k]] || '').trim() : ''; };
    var c = g('canal');
    var o = {fecha: parseFechaTxt(g('fecha'), periodo), hora: parseHora(g('hora')), canal: c ? parseCanal(c) : defCanal,
      tipo: g('tipo') || null, titulo: g('titulo'), asunto: g('asunto') || null, segmento: g('segmento') || null,
      notas: g('notas') || null, estado: parseEstado(g('estado')), err: null, aviso: null};
    if (!o.fecha) o.err = 'Fecha no válida' + (g('fecha') ? ': “' + g('fecha') + '”' : '');
    else if (!o.titulo) o.err = 'Falta el tema';

    else {
      var av = [];

// ── acciones comerciales: del archivo del cliente al calendario ────────────
// El archivo cambia de formato pero siempre trae "de tal fecha a tal fecha, tal
// acción". Se busca el rango de fechas en cada línea y lo que sobra es el nombre.
const MESES_RE = 'ene(?:ro)?|feb(?:rero)?|mar(?:zo)?|abr(?:il)?|may(?:o)?|jun(?:io)?|jul(?:io)?|ago(?:sto)?|sep(?:tiembre)?|set(?:iembre)?|oct(?:ubre)?|nov(?:iembre)?|dic(?:iembre)?';
function mesDeTxt(s){
  var n = normTxt(s).slice(0, 3);
  if (n === 'set') return 9;
  return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'].indexOf(n) + 1;
}
// sin año: el más cercano al mes que se está armando (dic → ene cruza de año)
function anioPara(mes, periodo){
  var y = +periodo.slice(0, 4), pm = +periodo.slice(5, 7);
  if (mes - pm > 6) return y - 1;
  if (pm - mes > 6) return y + 1;
  return y;
}
function fechaValida(y, m, d){
  var dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? ymd(y, m, d) : null;
}
function armarFecha(d, mNum, mTxt, yTxt, periodo){
  var m = mNum ? +mNum : mesDeTxt(mTxt);
  if (!m) return null;
  var y = yTxt ? (yTxt.length === 2 ? 2000 + +yTxt : +yTxt) : anioPara(m, periodo);
  return fechaValida(y, m, +d);
}
function extraerFechas(linea, periodo){
  // los días de la semana se tapan (mismo largo) para que "del lunes 2 al viernes 6" quede "2 al 6"
  linea = linea.replace(/\b(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/gi, function(w){ return ' '.repeat(w.length); });
  var encontradas = [], tapado = linea;
  var tapar = function(m){ tapado = tapado.slice(0, m.index) + ' '.repeat(m[0].length) + tapado.slice(m.index + m[0].length); };
  // "10 al 15/11", "10-15 de noviembre": el primer día toma el mes del segundo.
  // El lookbehind evita leer "10/11 al 15/11" como "11 al 15/11".
  var reCorto = new RegExp('(?<![\\d\\/.\\-])\\b(\\d{1,2})\\s*(?:al|a|-|–|y|hasta(?:\\s+el)?)\\s*(\\d{1,2})\\s*(?:[\\/.\\-]\\s*(\\d{1,2})(?:\\s*[\\/.\\-]\\s*(\\d{2,4}))?|\\s+(?:de\\s+)?(' + MESES_RE + ')\\b(?:\\s+(?:de\\s+)?(\\d{4}))?)', 'gi');
  var m;
  while ((m = reCorto.exec(linea))){
    var f2 = armarFecha(m[2], m[3], m[5], m[4] || m[6], periodo);
    var f1 = f2 ? fechaValida(+f2.slice(0, 4), +f2.slice(5, 7), +m[1]) : null;
    if (f1 && f2 && f1 <= f2){ encontradas.push({f: f1, pos: m.index}, {f: f2, pos: m.index + 1}); tapar(m); }
  }
  // fechas completas: 10/11, 10/11/2026, 10 de noviembre
  var reFull = new RegExp('\\b(\\d{1,2})\\s*(?:[\\/.\\-]\\s*(\\d{1,2})(?:\\s*[\\/.\\-]\\s*(\\d{2,4}))?|\\s+(?:de\\s+)?(' + MESES_RE + ')\\b(?:\\s+(?:de\\s+)?(\\d{4}))?)', 'gi');
  var base = tapado;
  while ((m = reFull.exec(base))){
    var f = armarFecha(m[1], m[2], m[4], m[3] || m[5], periodo);
    if (f){ encontradas.push({f: f, pos: m.index}); tapar(m); }
  }
  encontradas.sort(function(a, b){ return a.pos - b.pos; });

}
function limpiarNombre(s){
  var t = s.replace(/\b(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/gi, ' ')
    .replace(/\s*\|\s*/g, ' · ').replace(/\s+/g, ' ').trim();
  var borde = /^(?:[\s\-–:·,.;|]+|(?:del|desde|hasta|al|el|y|a|de|vigencia|fecha|fechas|acci[oó]n|acciones)\b)+|(?:[\s\-–:·,.;|]+|\b(?:del|desde|hasta|al|el|y|a|de)\b)+$/gi;
  var antes;
  do { antes = t; t = t.replace(borde, '').trim(); } while (t !== antes);
  return t;
}
function parseAcciones(txt, periodo){
  var out = [], prev = null, lineas = [];
  // varias acciones en una misma línea separadas por ";" se parten
  String(txt || '').split(/\r?\n/).forEach(function(l){
    var partes = l.split(/\s*;\s*/);
    var conFecha = partes.filter(function(p){ return extraerFechas(p, periodo).fechas.length; }).length;
    if (partes.length > 1 && conFecha > 1) lineas = lineas.concat(partes); else lineas.push(l);
  });
  lineas.forEach(function(l){
    var raw = l.replace(/\t+/g, ' | ').replace(/^\s*[|·]\s*|\s*[|·]\s*$/g, '').trim();
    if (!raw) return;
    var r = extraerFechas(raw, periodo);
    if (!r.fechas.length){
      // una fila de títulos ("Fecha | Acción | Descripción") se descarta
      var palabras = normTxt(raw).split(/[^a-z]+/).filter(Boolean);
      if (palabras.length && palabras.every(function(w){ return /^(fechas?|desde|hasta|inicio|fin|accion|acciones|descripcion|detalle|nombre|promo|promocion|vigencia|mecanica|canal|dia|dias|comercial|comerciales|observaciones|notas|de|y|del)$/.test(w); })) return;
      // sin fecha: es la descripción de la acción anterior (o un título suelto)
      if (prev) prev.notas = (prev.notas ? prev.notas + '\n' : '') + raw.replace(/\s*\|\s*/g, ' · ');
      return;
    }
    var desde = r.fechas[0], hasta = r.fechas[r.fechas.length - 1];
    if (hasta < desde){ var x = desde; desde = hasta; hasta = x; }
    prev = {desde: desde, hasta: hasta !== desde ? hasta : null, nombre: limpiarNombre(r.resto), notas: '', incluir: true};
    out.push(prev);
  });
  return out;
}
function diasEntre(a, b){ return Math.round((parseF(b) - parseF(a)) / 86400000); }
function sumarDias(f, n){ var d = parseF(f); d.setDate(d.getDate() + n); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); }

// ── tipos de acción ────────────────────────────────────────────────────────
const CATS   = ['bancaria','comercial','microevento','always_on'];   // orden en que se nombran al unificar
const CATL   = {bancaria:'Bancaria', always_on:'Always on', comercial:'Comercial', microevento:'Microevento'};
const CATPL  = {bancaria:'Bancarias', always_on:'Always on', comercial:'Comerciales', microevento:'Microeventos'};
const CATTIPO = {bancaria:'Acción bancaria', always_on:'Always on', comercial:'Promo', microevento:'Microevento'};
// sugerencia por palabras: el usuario la corrige si no acierta
function adivinarCategoria(txt){
  var t = normTxt(txt);
  if (/\b(banco|bancari|cuotas?|csi|tarjeta|visa|master|amex|naranja|cabal|galicia|santander|bbva|macro|icbc|hsbc|patagonia|supervielle|ciudad|provincia|nacion|credicoop|reintegro|cashback|modo|mercado ?pago|cuenta dni|go ?cuotas)/.test(t)) return 'bancaria';
  if (/\b(flash|hot ?hour|happy ?hour|\d+ ?(h|hs|horas)\b|solo (por )?hoy|por hoy|micro|relampago|fin de semana|finde)/.test(t)) return 'microevento';
  if (/\b(always|todo el mes|siempre|permanente|vigente todo)/.test(t)) return 'always_on';
  return 'comercial';
}
function parseAccionesCat(txt, periodo){
  var a = parseAcciones(txt, periodo);
  a.forEach(function(x){ x.cat = adivinarCategoria(x.nombre + ' ' + x.notas); });
  return a;
}
function selectCat(valor, onchange, cls){
  return '<select class="m-in ' + (cls || '') + '" onchange="' + onchange + '">' +
    CATS.map(function(c){ return '<option value="' + c + '"' + (c === valor ? ' selected' : '') + '>' + CATL[c] + '</option>'; }).join('') + '</select>';
}

// receta: qué envíos se arman por cada acción (se recuerda por marca)
function recetaDefault(cs){
  var fin = cs.indexOf('wpp') >= 0 ? 'wpp' : cs.indexOf('push') >= 0 ? 'push' : cs[0];
  var ini = {}; cs.forEach(function(k){ ini[k] = k === 'email'; });
  if (cs.indexOf('email') < 0) ini[cs[0]] = true;
  return {ini: ini, mitad: false, mitadCanal: cs.indexOf('push') >= 0 ? 'push' : cs[0], ultimo: true, ultimoCanal: fin,
    cats: {bancaria: true, always_on: false, comercial: true, microevento: true}, unificar: true, bancos: true};
}
// piezas sueltas: cada acción aporta sus envíos (inicio / recordatorio / último día)
function enviosDeAccion(a, rec, cs){
  var out = [], fin = a.hasta || a.desde, dur = diasEntre(a.desde, fin);
  var pieza = function(fecha, canal, kind){ return {fecha: fecha, canal: canal, kind: kind, nombre: a.nombre, cat: a.cat || 'comercial'}; };
  cs.forEach(function(k){ if (rec.ini[k]) out.push(pieza(a.desde, k, 'inicio')); });
  if (rec.mitad && dur >= 3) out.push(pieza(sumarDias(a.desde, Math.floor(dur / 2)), rec.mitadCanal, 'recordatorio'));
  if (rec.ultimo && dur >= 1) out.push(pieza(fin, rec.ultimoCanal, 'ultimo'));
  return out;
}
// "A + B — último día" si todas las piezas son del mismo momento; si no, cada una con su etiqueta
function tituloUnificado(items){
  var propias = items.filter(function(it){ return it.kind !== 'vigente'; });
  var kinds = propias.map(function(it){ return it.kind; }).filter(function(k, i, a){ return a.indexOf(k) === i; });
  // con bancarias vigentes no va sufijo general: "— último día" parecería que termina el banco también
  var hayVigentes = items.some(function(it){ return it.kind === 'vigente'; });
  var igual = kinds.length <= 1 && !hayVigentes, kind = kinds[0];
  var nombres = items.map(function(it){
    if (igual || it.kind === 'vigente' || it.kind === 'inicio') return it.nombre;
    return it.kind === 'ultimo' ? 'Último día ' + it.nombre : it.nombre + ' (recordatorio)';
  });
  var suf = igual && kind === 'ultimo' ? ' — último día' : igual && kind === 'recordatorio' ? ' — recordatorio' : '';
  return nombres.join(' + ') + suf;
}

// Excel: se carga la librería solo cuando hace falta
function cargarXLSX(){

  return new Promise(function(ok, mal){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function leerArchivoAcciones(file){
  if (!file) return;
  var esExcel = /\.xlsx?$/i.test(file.name);
  var listo = function(txt){
    frm.txt = txt; $('acTxt').value = txt;

  if (!esExcel){
    var r = new FileReader();

    r.readAsText(file);
    return;
  }
  cargarXLSX().then(function(){
    var r = new FileReader();
    r.onload = function(){
      var wb = XLSX.read(new Uint8Array(r.result), {type: 'array', cellDates: true});
      var lineas = [];
      wb.SheetNames.forEach(function(n){
        XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: false, dateNF: 'dd/mm/yyyy', blankrows: false}).forEach(function(row){
          var celdas = row.map(function(c){ return String(c == null ? '' : c).replace(/\s+/g, ' ').trim(); }).filter(Boolean);
          if (celdas.length) lineas.push(celdas.join('\t'));
        });
      });
      listo(lineas.join('\n'));
    };
    r.readAsArrayBuffer(file);
  }).catch(function(e){ toast(e.message + '. Copiá y pegá el contenido.', true); });
}
function accionesElegidas(){ return manualesValidas().concat(frm.acciones.filter(function(a){ return a.incluir && a.nombre; })); }

// Arma los envíos finales: junta las piezas del mismo día y canal en uno solo,
// les suma las bancarias vigentes ese día y, si ya hay un envío armado desde
// acciones en ese día/canal, propone sumarle el nombre en vez de crear otro.
function enviosPropuestos(){
  var m = sel.marca, cs = canalesDe(m), rec = frm.rec, acc = accionesElegidas();
  var piezas = [];
  acc.forEach(function(a){
    if (rec.cats[a.cat || 'comercial'] === false) return;
    piezas = piezas.concat(enviosDeAccion(a, rec, cs));
  });
  var grupos = {}, orden = [];
  piezas.forEach(function(p){
    var k = rec.unificar ? p.fecha + '|' + p.canal : p.fecha + '|' + p.canal + '|' + p.nombre + '|' + p.kind;
    if (!grupos[k]){ grupos[k] = []; orden.push(k); }
    if (!grupos[k].some(function(x){ return x.nombre === p.nombre; })) grupos[k].push(p);
  });
  // bancarias vigentes: las que se están cargando + las que ya estaban en la marca
  var bancos = acc.filter(function(a){ return a.cat === 'bancaria'; }).map(function(a){ return {nombre: a.nombre, desde: a.desde, hasta: a.hasta || a.desde}; })
    .concat(D.fechas.filter(function(f){ return f.marca_id === m && f.categoria === 'bancaria'; })
      .map(function(f){ return {nombre: f.nombre, desde: f.fecha, hasta: f.hasta || f.fecha}; }));
  var envsMarca = D.env[m] || [];
  var out = [];
  orden.forEach(function(k){
    var items = grupos[k].slice(), fecha = items[0].fecha, canal = items[0].canal;
    if (rec.bancos){
      bancos.forEach(function(bk){
        if (fecha >= bk.desde && fecha <= bk.hasta && !items.some(function(x){ return x.nombre === bk.nombre; }))
          items.push({nombre: bk.nombre, kind: 'vigente', cat: 'bancaria'});
      });
    }
    // si el día solo tiene bancarias "vigentes" sin pieza propia, no hay envío
    if (!items.some(function(x){ return x.kind !== 'vigente'; })) return;
    items.sort(function(a, b){ return CATS.indexOf(a.cat) - CATS.indexOf(b.cat); });
    var titulo = tituloUnificado(items);
    var principal = items.filter(function(x){ return x.kind !== 'vigente'; })[0];
    var prop = {fecha: fecha, canal: canal, titulo: titulo, tipo: CATTIPO[principal.cat] || 'Promo',
      piezas: items.length, nombres: items.map(function(x){ return x.nombre; })};
    if (envsMarca.some(function(x){ return x.fecha === fecha && x.canal === canal && x.titulo === titulo; })) return;
    // ¿ya hay uno armado desde acciones ese día y canal? se le suman los nombres que falten
    var previo = envsMarca.find(function(x){
      return x.fecha === fecha && x.canal === canal && x.notas === MARCA_ACCIONES && (x.estado === 'planificado' || x.estado === 'idea');
    });
    if (previo){
      var faltan = prop.nombres.filter(function(n){ return previo.titulo.indexOf(n) < 0; });
      if (!faltan.length) return;
      prop.update = previo.id;
      prop.titulo = previo.titulo + ' + ' + faltan.join(' + ');
    }
    out.push(prop);
  });
  return out.sort(function(a, b){ return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : CANALES.indexOf(a.canal) - CANALES.indexOf(b.canal); });
}

    }).join('') + '</div>' +

  if (envs.length){

function importarAcciones(){

  var sumas = envs.filter(function(e){ return e.update; });
  $('acBtn').disabled = true;
  var p1 = fechas.length ? sb.from('cal_fechas').insert(fechas).select() : Promise.resolve({data: []});
  p1.then(function(r){
    if (r.error){
      if (/categoria/i.test(r.error.message)) throw new Error('Falta actualizar la base: corré de nuevo calendario-schema.sql en Supabase');
      throw r.error;
    }
    r.data.forEach(function(f){ D.fechas.push(f); });
    return nuevos.length ? sb.from('cal_envios').insert(nuevos).select() : {data: []};
  }).then(function(r){
    if (r.error) throw r.error;

      return sb.from('cal_envios').update({titulo: e.titulo, actualizado_at: ahora}).eq('id', e.update).select().single().then(function(u){
        if (u.error) throw u.error;
        reemplazarLocal(u.data);
      });
    })).then(function(){ return r.data.length; });
  }).then(function(n){
    cerrarDrawer(); render();
    toast(elegidas.length + ' acción(es) y ' + (n + sumas.length) + ' envío(s) cargados');
  }).catch(function(e){ $('acBtn').disabled = false; toast(e.message || String(e), true); });

// ── cerrar el mes: marcar qué salió y dejar los aprendizajes ───────────────
function abrirCierre(){
  var envs = envDeMes(sel.marca, sel.periodo);
  var reg = mesReg(sel.marca, sel.periodo) || {};
  frm = {tipo: 'cierre', est: {}};
  envs.forEach(function(e){
    frm.est[e.id] = (e.estado === 'cancelado' || e.estado === 'enviado') ? e.estado
      : (e.estado === 'idea' ? 'cancelado' : 'enviado');
  });
  frm.funciono = reg.funciono || ''; frm.no_funciono = reg.no_funciono || ''; frm.repetir = reg.repetir || '';
  dibujarCierre();
}
function leerCierre(){
  if (!$('cFun')) return;
  frm.funciono = $('cFun').value; frm.no_funciono = $('cNo').value; frm.repetir = $('cRep').value;
}
function dibujarCierre(){
  var envs = envDeMes(sel.marca, sel.periodo), f = frm;
  var b = '<div class="note blue">Confirmá qué salió y qué no. Queda como historial y aparece como “mes anterior” cuando armes el próximo.</div>' +
    '<div class="dsec">Envíos del mes</div>' +
    (envs.length ? envs.map(function(e){
      return '<div class="pick-row"><span class="f">' + dowDe(e.fecha) + ' ' + fechaCorta(e.fecha) + '</span><i class="dot ' + e.canal + '"></i>' +
        '<span class="t">' + esc(e.titulo) + '</span><span class="seg">' +
        ['enviado','cancelado'].map(function(s){
          return '<button class="' + s + (f.est[e.id] === s ? ' on' : '') + '" onclick="leerCierre();frm.est[' + e.id + ']=\'' + s + '\';dibujarCierre()">' + ELABEL[s] + '</button>';
        }).join('') + '</span></div>';
    }).join('') : '<div class="muted" style="font-size:12px">No hay envíos cargados.</div>') +
    '<div class="dsec">Aprendizajes</div>' +
    '<div class="fg"><label>Qué funcionó</label><textarea id="cFun">' + esc(f.funciono) + '</textarea></div>' +
    '<div class="fg"><label>Qué no funcionó</label><textarea id="cNo">' + esc(f.no_funciono) + '</textarea></div>' +
    '<div class="fg"><label>Para repetir / probar el mes que viene</label><textarea id="cRep">' + esc(f.repetir) + '</textarea></div>';
  abrirDrawer('Cerrar ' + periodoLargo(sel.periodo), D.marcaById[sel.marca].nombre, b,
    '<button class="btn-orange" onclick="ejecutarCierre()">Cerrar el mes</button>');
}
function ejecutarCierre(){
  leerCierre();
  var f = frm, envs = envDeMes(sel.marca, sel.periodo);
  var grupos = {enviado: [], cancelado: []};
  envs.forEach(function(e){ if (f.est[e.id] && f.est[e.id] !== e.estado) grupos[f.est[e.id]].push(e.id); });
  var ahora = new Date().toISOString();
  var ps = Object.keys(grupos).filter(function(k){ return grupos[k].length; }).map(function(k){
    return sb.from('cal_envios').update({estado: k, actualizado_at: ahora}).in('id', grupos[k]).select().then(function(r){
      if (r.error) throw r.error;
      r.data.forEach(reemplazarLocal);
    });
  });
  Promise.all(ps).then(function(){
    return upsertMes({estado: 'cerrado', funciono: f.funciono.trim() || null,
      no_funciono: f.no_funciono.trim() || null, repetir: f.repetir.trim() || null});
  }).then(function(d){
    if (!d) return;
    cerrarDrawer(); render(); toast('Mes cerrado');
  }).catch(function(e){ toast(e.message || String(e), true); });
}

function filasExport(envs, marcaNombre){
  return envs.map(function(e){

      e.titulo, e.asunto || '', e.segmento || '', ELABEL[e.estado], e.notas || ''];
  });
}
const CAB_EXPORT = ['Marca','Fecha','Día','Hora','Canal','Tipo','Tema','Asunto / copy','Segmento','Estado','Notas'];
function nombreDe(e){ return (D.marcaById[e.marca_id] || {}).nombre || ''; }
function envsExport(){ return envDeMes(sel.marca, sel.periodo).filter(function(e){ return filtroCanal[e.canal]; }); }

function copiarSheets(){
  var envs = envsExport();
  if (!envs.length) return toast('No hay envíos para copiar', true);
  var limpio = function(v){ return String(v).replace(/[\t\r\n]+/g, ' '); };
  var txt = [CAB_EXPORT].concat(filasExport(envs, nombreDe)).map(function(r){ return r.map(limpio).join('\t'); }).join('\n');
  navigator.clipboard.writeText(txt).then(function(){
    toast(envs.length + ' filas copiadas: pegalas en Sheets con Ctrl+V');
  }, function(){ toast('El navegador no dejó copiar; usá Descargar CSV', true); });
}
function bajarCSV(filas, nombre){
  var q = function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; };
  var csv = '﻿' + [CAB_EXPORT].concat(filas).map(function(r){ return r.map(q).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
}
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase(); }
function descargarCSV(){
  var envs = envsExport();

}

    return {m: m, c: c, cP: cP, reg: reg, regP: regP};
  });
  var conCal = filas.filter(function(f){ return f.c.total > 0; }).length;

    CANALES.map(function(k){ return '<div class="kpi ' + k + '"><div class="kpi-label">' + CLABEL[k] + '</div><div class="kpi-val">' + tot[k] + '</div></div>'; }).join('') +

    });
  });

  $('panes').innerHTML = h + '</tbody></table></div></div>';
}
function csvEquipo(){
  var p = sel.periodo;
  fetchAll('cal_envios', '*', function(q){ return q.gte('fecha', p).lte('fecha', finMes(p)).order('fecha'); }).then(function(rows){
    if (!rows.length) return toast('No hay envíos en ' + periodoLargo(p), true);

  }).catch(function(e){ toast(e.message || String(e), true); });
}

// ══ HISTORIAL DE LA MARCA ═══════════════════════════════════════════════════
function renderHistorial(){
